<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B HIVE Experiment Loop Tests (beta10c)</title>
<link rel="stylesheet" href="../css/app.css?test=first-flight-step3e-b-first-honey-final">
<style>
  body{background:#15120c;color:#ece4d2;font:14px/1.6 system-ui,sans-serif;max-width:780px;margin:40px auto;padding:0 20px}
  h1{color:#c9ae78;font-size:20px;border-bottom:1px solid rgba(237,228,210,.1);padding-bottom:10px}
  .test{padding:6px 10px;margin:3px 0;border-radius:4px;font:12px/1.5 monospace}
  .pass{background:rgba(148,160,109,.15);color:#a3b07f}.fail{background:rgba(207,140,84,.2);color:#cf8c54}
  .summary{margin-top:24px;padding:12px;border:1px solid #c9ae78;border-radius:8px}.summary b{color:#e2c890}
</style>
</head>
<body>
<h1>B HIVE Deterministic Experiment Loop Tests</h1>
<div id="results"></div>
<div id="sandbox" hidden></div>
<script src="../js/bhive-data.js?test=beta10c-stage4"></script>
<script src="../js/bhive-engine.js?test=beta10c-stage4"></script>
<script src="../js/bhive-learning.js?test=beta10c-stage4"></script>
<script src="../js/bhive-inference.js?test=beta10c-stage4"></script>
<script src="../js/bhive-memory-use.js?test=beta10c-stage5c-fix2"></script>
<script src="../js/bhive-experiments.js?test=beta10c-stage5c-fix2"></script>
<script src="../js/ui-experiments.js?test=first-flight-step3e-b-first-honey-final"></script>
<script src="./fixtures/learning-fixtures.js?test=beta10c-stage4"></script>
<script>
(function(){
  'use strict';
  var I=BHIVE.inference,X=BHIVE.experiments,U=BHIVE.experimentUI,F=BHIVE_TEST_FIXTURES;
  var out=document.getElementById('results'),box=document.getElementById('sandbox'),passed=0,failed=0,eventSeq=0;
  function test(name,fn){
    var ok=false,msg='';
    try{ok=!!fn();}catch(e){msg=' - threw: '+e.message;}
    out.innerHTML+='<div class="test '+(ok?'pass':'fail')+'">'+(ok?'PASS ':'FAIL ')+name+msg+'</div>';
    if(ok)passed++;else failed++;
  }
  function cell(key){return F.cells.filter(function(item){return item.key===key;})[0];}
  function source(verdict,options){
    var events=F.rising(),observation=I.trendObservation(events,cell('lw'),7,F.NOW);
    var feedback=F.insightFeedback(0,observation,verdict||'true');
    var all=events.concat(feedback);
    return {
      evidence:events,
      observation:observation,
      feedback:feedback,
      events:all,
      proposal:X.proposalForFeedback(feedback,[observation],F.cells,all,F.NOW,options)
    };
  }
  function experimentEvent(type,payload,offset){
    eventSeq++;
    return {id:'experiment_fixture_'+eventSeq,type:type,ts:F.NOW+(offset||0),cellKey:payload.cellKey||null,payload:payload};
  }
  function accepted(sourceData,offset){
    var payload=X.decisionPayload(sourceData.proposal,'accepted');
    return experimentEvent('experiment_accepted',payload,offset||1);
  }
  function firstFlightEvent(type,cellKey,payload,offset){
    return BHIVE.learningTools.createEvent(type,{
      ts:F.NOW+(offset||0),cellKey:cellKey||null,payload:payload
    });
  }
  function firstFlightProgress(cellKey){
    return [
      firstFlightEvent('first_flight_available',null,{version:1},-4000),
      firstFlightEvent('first_flight_cell_selected',cellKey,{version:1},-3000),
      firstFlightEvent('first_flight_answered',cellKey,{
        version:1,question:1,answer:'The part that matters most'
      },-2000),
      firstFlightEvent('first_flight_answered',cellKey,{
        version:1,question:2,answer:'Take one small concrete step'
      },-1000)
    ];
  }
  function choice(strategyId){
    return {strategyId:strategyId,action:'Try '+strategyId,measure:'Measure '+strategyId,durationDays:3};
  }
  function provenance(id,influence){
    return {memoryId:'mem_'+id,evidenceKey:'evidence_'+id,
      feedbackEventId:'feedback_'+id,influence:influence};
  }
  function memorySignal(id,influence,delta,veto){
    var adapterInfluence=veto?'veto':'preference';
    var item=provenance(id,adapterInfluence);
    return {veto:!!veto,delta:delta||0,influence:adapterInfluence,provenance:item};
  }
  function installMemoryAdapter(signals,validator){
    BHIVE.memoryUse={
      strategySignal:function(context,candidate,scope,sourceEvidenceIds){
        var signal=typeof signals==='function'?signals(context,candidate,scope,sourceEvidenceIds):
          signals&&signals[candidate.strategyId];
        return signal?JSON.parse(JSON.stringify(signal)):null;
      },
      validateProvenance:function(item,context){
        return validator?validator(item,context):!!context&&context.valid!==false&&
          (item.influence==='preference'||item.influence==='veto');
      }
    };
  }

  test('First Flight publishes the approved foundation questions and titles',function(){
    var flight=X.FIRST_FLIGHT;
    return flight.lw.title==='Make the first move'&&
      flight.lw.questions[0]==='What feels most important in your work or direction right now?'&&
      flight.lw.questions[1]==='What is one small step you can take toward it today?'&&
      flight.health.title==='Support your health'&&
      flight.health.questions[0]==='How are your body and energy feeling right now?'&&
      flight.health.questions[1]==='What is one small thing you can do for your health today?'&&
      flight.people.title==='Strengthen the connection'&&
      flight.people.questions[0]==='Which relationship or connection needs your attention most right now?'&&
      flight.people.questions[1]==='What is one small, respectful step you can take today?';
  });
  test('First Flight mission generation requires two valid foundation answers',function(){
    return X.firstFlightMission('lw',['context'],F.NOW)===null&&
      X.firstFlightMission('money',['context','action'],F.NOW)===null&&
      X.firstFlightMission('health',['','action'],F.NOW)===null&&
      X.firstFlightMission('people',['context',''],F.NOW)===null;
  });
  test('First Flight mission preserves normalized context and uses answer two directly',function(){
    var mission=X.firstFlightMission('lw',[
      '  Finish   the beta well ',
      '  Open the notes\n and choose one fix  '
    ],F.NOW);
    return mission&&mission.sourceRead==='Finish the beta well'&&
      mission.action==='Open the notes and choose one fix'&&mission.title==='Make the first move'&&
      mission.strategyId==='first_flight_v1_lw'&&mission.observationKind==='first_flight'&&
      mission.firstFlightVersion===1&&X.isFirstFlight(mission);
  });
  test('First Flight mission generation is deterministic and leaves answers untouched',function(){
    var answers=['Protect my energy','Take a short walk'],before=JSON.stringify(answers);
    var first=X.firstFlightMission('health',answers,F.NOW);
    var second=X.firstFlightMission('health',answers,F.NOW);
    return JSON.stringify(first)===JSON.stringify(second)&&JSON.stringify(answers)===before&&
      first.experimentId.indexOf('exp_first_flight_v1_')===0;
  });
  test('First Flight mission rejects answers beyond the 280-character contract',function(){
    var tooLong=new Array(282).join('x');
    return X.firstFlightMission('people',[tooLong,'Send a message'],F.NOW)===null&&
      X.firstFlightMission('people',['Reconnect',tooLong],F.NOW)===null;
  });
  test('First Flight reducer distinguishes every recoverable progress state',function(){
    var events=firstFlightProgress('lw');
    return X.firstFlightState([])===null&&
      X.firstFlightState(events.slice(0,1)).status==='available'&&
      X.firstFlightState(events.slice(0,2)).status==='cell_selected'&&
      X.firstFlightState(events.slice(0,3)).status==='first_answer_recorded'&&
      X.firstFlightState(events).status==='mission_ready';
  });
  test('First Flight reducer recovers deterministically from persisted event order',function(){
    var events=firstFlightProgress('health'),before=JSON.stringify(events);
    var shuffled=[events[3],events[1],events[0],events[2]];
    var state=X.firstFlightState(shuffled);
    return state.status==='mission_ready'&&state.cellKey==='health'&&state.answers.length===2&&
      state.mission.title==='Support your health'&&JSON.stringify(events)===before;
  });
  test('First Flight reducer rejects out-of-order and mismatched progress safely',function(){
    var available=firstFlightEvent('first_flight_available',null,{version:1},-5000);
    var selected=firstFlightEvent('first_flight_cell_selected','lw',{version:1},-4000);
    var second=firstFlightEvent('first_flight_answered','lw',{
      version:1,question:2,answer:'Move second'
    },-3000);
    var mismatch=firstFlightEvent('first_flight_answered','health',{
      version:1,question:1,answer:'Wrong cell'
    },-2000);
    var first=firstFlightEvent('first_flight_answered','lw',{
      version:1,question:1,answer:'Move first'
    },-1000);
    var state=X.firstFlightState([available,selected,second,mismatch,first]);
    return state.status==='first_answer_recorded'&&state.cellKey==='lw'&&
      state.answers.length===1&&state.answers[0]==='Move first';
  });
  test('First Flight reducer ignores malformed progress events and later cell changes',function(){
    var events=firstFlightProgress('people').slice(0,2);
    var forged=JSON.parse(JSON.stringify(firstFlightEvent('first_flight_answered','people',{
      version:1,question:1,answer:'Reach out kindly'
    },-2000)));
    forged.id='forged_first_flight_event';
    events.push(firstFlightEvent('first_flight_cell_selected','health',{version:1},-1500),forged);
    var state=X.firstFlightState(events);
    return state.status==='cell_selected'&&state.cellKey==='people'&&state.answers.length===0;
  });
  test('First Flight requires explicit matching acceptance before completion',function(){
    var events=firstFlightProgress('lw'),ready=X.firstFlightState(events),mission=ready.mission;
    var completion=experimentEvent('experiment_completed',X.completionPayload(mission,'completed'),2);
    var beforeAccept=X.firstFlightState(events.concat(completion));
    var accept=experimentEvent('experiment_accepted',X.decisionPayload(mission,'accepted'),1);
    var active=X.firstFlightState(events.concat(accept));
    var forged=JSON.parse(JSON.stringify(X.completionPayload(mission,'completed')));
    forged.action='A mismatched completion';
    var mismatch=experimentEvent('experiment_completed',forged,1.5);
    var afterMismatch=X.firstFlightState(events.concat(accept,mismatch));
    var completed=X.firstFlightState(events.concat(accept,completion));
    return beforeAccept.status==='mission_ready'&&active.status==='mission_active'&&
      afterMismatch.status==='mission_active'&&
      completed.status==='mission_completed'&&completed.completedEventId===completion.id;
  });
  test('First Flight cannot use the normal experiment editor or a mismatched mission',function(){
    var events=firstFlightProgress('lw'),mission=X.firstFlightState(events).mission;
    var forged=JSON.parse(JSON.stringify(mission));forged.action='A different action';forged.decision='accepted';
    var accept=experimentEvent('experiment_accepted',forged,1);
    return X.decisionPayload(mission,'edited',{action:'Changed',measure:'Changed'})===null&&
      X.firstFlightState(events.concat(accept)).status==='mission_ready';
  });
  test('neutral completed is permitted only for First Flight',function(){
    var mission=X.firstFlightState(firstFlightProgress('people')).mission;
    var normal=source().proposal;
    return X.completionPayload(mission,'completed').outcome==='completed'&&
      X.completionPayload(mission,'helped')===null&&
      X.completionPayload(normal,'completed')===null&&
      X.completionPayload(normal,'helped').outcome==='helped';
  });
  test('First Flight completion creates no outcome score or strategy evidence',function(){
    var mission=X.firstFlightState(firstFlightProgress('health')).mission;
    var complete=experimentEvent('experiment_completed',X.completionPayload(mission,'completed'),1);
    var stats=X.strategyStats([complete],mission.strategyId,mission.cellKey);
    var normal=source(),helped=experimentEvent(
      'experiment_completed',X.completionPayload(normal.proposal,'helped'),2);
    var normalStats=X.strategyStats([helped],normal.proposal.strategyId,normal.proposal.cellKey);
    return stats.completed===0&&stats.declined===0&&stats.score===0&&
      normalStats.completed===1&&normalStats.score>0&&
      JSON.stringify(X.OUTCOMES)===JSON.stringify({helped:2,partly:0.75,no_change:-0.75,made_worse:-2});
  });

  test('true feedback creates one evidence-linked proposal',function(){
    var data=source(),proposal=data.proposal;
    return proposal&&proposal.insightId===data.observation.id&&
      proposal.evidenceKey===I.evidenceKey(data.observation)&&
      proposal.evidenceEventIds.length===data.observation.evidenceEventIds.length;
  });
  test('partly feedback can create a tentative proposal',function(){
    var data=source('partly');
    return data.proposal&&data.proposal.sourceVerdict==='partly';
  });
  test('wrong feedback never creates an experiment',function(){return source('wrong').proposal===null;});
  test('not-now feedback never creates an experiment',function(){return source('not_now').proposal===null;});
  test('a proposal requires the exact observation and evidence set',function(){
    var data=source();
    return X.proposalForFeedback(data.feedback,[],F.cells,data.events,F.NOW)===null;
  });
  test('a proposal rejects missing, duplicate, or unrelated feedback evidence IDs',function(){
    var data=source(),missing=JSON.parse(JSON.stringify(data.feedback));
    var duplicate=JSON.parse(JSON.stringify(data.feedback)),unrelated=JSON.parse(JSON.stringify(data.feedback));
    missing.payload.evidenceEventIds=[];
    duplicate.payload.evidenceEventIds.push(duplicate.payload.evidenceEventIds[0]);
    unrelated.payload.evidenceEventIds=['unrelated'];
    return X.proposalForFeedback(missing,[data.observation],F.cells,data.events,F.NOW)===null&&
      X.proposalForFeedback(duplicate,[data.observation],F.cells,data.events,F.NOW)===null&&
      X.proposalForFeedback(unrelated,[data.observation],F.cells,data.events,F.NOW)===null;
  });
  test('proposal generation is deterministic for a fixed time',function(){
    var data=source();
    return JSON.stringify(data.proposal)===JSON.stringify(
      X.proposalForFeedback(data.feedback,[data.observation],F.cells,data.events,F.NOW));
  });
  test('proposal generation does not mutate evidence or observations',function(){
    var data=source(),eventsBefore=JSON.stringify(data.events),observationBefore=JSON.stringify(data.observation);
    X.proposalForFeedback(data.feedback,[data.observation],F.cells,data.events,F.NOW);
    return JSON.stringify(data.events)===eventsBefore&&JSON.stringify(data.observation)===observationBefore;
  });
  test('accepted payload is a defensive lifecycle record',function(){
    var data=source(),payload=X.decisionPayload(data.proposal,'accepted');
    payload.evidenceEventIds.push('changed');
    return payload.decision==='accepted'&&data.proposal.evidenceEventIds.indexOf('changed')<0;
  });
  test('edited payload keeps identity and uses validated edits',function(){
    var data=source(),payload=X.decisionPayload(data.proposal,'edited',{
      action:'  Try my own smaller action  ',measure:'  Do it once and compare  '
    });
    return payload.experimentId===data.proposal.experimentId&&payload.decision==='edited'&&
      payload.action==='Try my own smaller action'&&payload.measure==='Do it once and compare';
  });
  test('blank edited actions are rejected',function(){
    var data=source();
    return X.decisionPayload(data.proposal,'edited',{action:' ',measure:'Done once'})===null;
  });
  test('malformed durations are rejected instead of becoming NaN',function(){
    var data=source(),malformed=JSON.parse(JSON.stringify(data.proposal));
    delete malformed.durationDays;
    return X.decisionPayload(malformed,'accepted')===null;
  });
  test('an accepted event restores one active experiment',function(){
    var data=source(),event=accepted(data),active=X.activeExperiment(data.events.concat(event));
    return active&&active.status==='active'&&active.experimentId===data.proposal.experimentId;
  });
  test('an edited event becomes active with the edited text',function(){
    var data=source(),payload=X.decisionPayload(data.proposal,'edited',{action:'Try one custom move',measure:'Complete it once'});
    var active=X.activeExperiment(data.events.concat(experimentEvent('experiment_edited',payload,1)));
    return active&&active.action==='Try one custom move'&&active.measure==='Complete it once';
  });
  test('declining closes an experiment without leaving it active',function(){
    var data=source(),accept=accepted(data,1),decline=X.declinePayload(data.proposal,'stopped');
    var events=data.events.concat([accept,experimentEvent('experiment_declined',decline,2)]);
    return X.lifecycle(events,data.proposal.experimentId).status==='declined'&&X.activeExperiment(events)===null;
  });
  test('completion closes an experiment and preserves its outcome',function(){
    var data=source(),accept=accepted(data,1),complete=X.completionPayload(data.proposal,'helped');
    var events=data.events.concat([accept,experimentEvent('experiment_completed',complete,2)]);
    var state=X.lifecycle(events,data.proposal.experimentId);
    return state.status==='completed'&&state.outcome==='helped'&&X.activeExperiment(events)===null;
  });
  test('unsupported completion outcomes are rejected',function(){
    return X.completionPayload(source().proposal,'perhaps')===null;
  });
  test('the newest active lifecycle wins if synced data conflicts',function(){
    var first=source(),second=source(),secondProposal=JSON.parse(JSON.stringify(second.proposal));
    secondProposal.experimentId='exp_second';secondProposal.insightId='obs_second';secondProposal.evidenceKey='second_evidence';
    var events=first.events.concat([accepted(first,1),experimentEvent('experiment_accepted',X.decisionPayload(secondProposal,'accepted'),2)]);
    return X.activeExperiment(events).experimentId==='exp_second';
  });
  test('finishing a newer synced experiment does not revive an older one',function(){
    var first=source(),second=source(),secondProposal=JSON.parse(JSON.stringify(second.proposal));
    secondProposal.experimentId='exp_second';secondProposal.insightId='obs_second';secondProposal.evidenceKey='second_evidence';
    var events=first.events.concat([
      accepted(first,1),
      experimentEvent('experiment_accepted',X.decisionPayload(secondProposal,'accepted'),2),
      experimentEvent('experiment_completed',X.completionPayload(secondProposal,'helped'),3)
    ]);
    return X.activeExperiment(events)===null;
  });
  test('same-millisecond lifecycle events retain append order',function(){
    var data=source(),accept=accepted(data,1),complete=experimentEvent(
      'experiment_completed',X.completionPayload(data.proposal,'helped'),1);
    var events=data.events.concat([accept,complete]);
    return X.lifecycle(events,data.proposal.experimentId).status==='completed'&&X.activeExperiment(events)===null;
  });
  test('an active experiment blocks another proposal',function(){
    var data=source(),events=data.events.concat(accepted(data));
    return X.proposalForFeedback(data.feedback,[data.observation],F.cells,events,F.NOW)===null;
  });
  test('a prior decision blocks a duplicate proposal for the same evidence',function(){
    var data=source(),decline=X.declinePayload(data.proposal,'not_now');
    var events=data.events.concat(experimentEvent('experiment_declined',decline,1));
    return X.decisionForFeedback(events,data.feedback).type==='experiment_declined'&&
      X.proposalForFeedback(data.feedback,[data.observation],F.cells,events,F.NOW)===null;
  });
  test('recent unhandled trusted feedback can resume its proposal',function(){
    var events=F.rising(),observation=I.trendObservation(events,cell('lw'),7,F.NOW);
    var feedback=F.insightFeedback(1,observation,'true'),all=events.concat(feedback);
    return X.latestPendingFeedback(all,F.NOW).id===feedback.id&&
      !!X.proposalForFeedback(feedback,[observation],F.cells,all,F.NOW);
  });
  test('a decision removes trusted feedback from the pending queue',function(){
    var events=F.rising(),observation=I.trendObservation(events,cell('lw'),7,F.NOW);
    var feedback=F.insightFeedback(1,observation,'true'),all=events.concat(feedback);
    var proposal=X.proposalForFeedback(feedback,[observation],F.cells,all,F.NOW);
    all.push(experimentEvent('experiment_declined',X.declinePayload(proposal,'not_now'),1));
    return X.latestPendingFeedback(all,F.NOW)===null;
  });
  test('negative and expired feedback never become pending experiments',function(){
    var events=F.rising(),observation=I.trendObservation(events,cell('lw'),7,F.NOW);
    var wrong=F.insightFeedback(1,observation,'wrong');
    var expired=F.insightFeedback(8,observation,'true');
    return X.latestPendingFeedback(events.concat([wrong,expired]),F.NOW)===null;
  });
  test('latest closed event is limited to the current local day',function(){
    var data=source(),payload=X.completionPayload(data.proposal,'partly');
    var yesterday=experimentEvent('experiment_completed',payload,-F.DAY);
    var today=experimentEvent('experiment_completed',payload,2);
    return X.latestClosedToday([today,yesterday],F.NOW).id===today.id&&
      X.latestClosedToday([yesterday],F.NOW)===null;
  });
  test('a no-change outcome lowers that strategy on the next similar read',function(){
    var data=source(),firstStrategy=data.proposal.strategyId;
    var complete=X.completionPayload(data.proposal,'no_change');
    var history=[experimentEvent('experiment_completed',complete,-F.DAY)];
    var ranked=X.rankCandidates(X.candidatesFor(data.observation,F.cells),history,data.proposal.cellKey);
    return ranked[0].candidate.strategyId!==firstStrategy&&ranked[0].stats.score===0;
  });
  test('a helpful outcome keeps that strategy preferred',function(){
    var data=source(),complete=X.completionPayload(data.proposal,'helped');
    var history=[experimentEvent('experiment_completed',complete,-F.DAY)];
    var ranked=X.rankCandidates(X.candidatesFor(data.observation,F.cells),history,data.proposal.cellKey);
    return ranked[0].candidate.strategyId===data.proposal.strategyId&&ranked[0].stats.completed===1;
  });
  test('declined strategies are gently deprioritised',function(){
    var data=source(),decline=X.declinePayload(data.proposal,'not_now');
    var history=[experimentEvent('experiment_declined',decline,-F.DAY)];
    var ranked=X.rankCandidates(X.candidatesFor(data.observation,F.cells),history,data.proposal.cellKey);
    return ranked[0].candidate.strategyId!==data.proposal.strategyId;
  });
  test('memory-free ranking and proposals preserve their baseline output',function(){
    var data=source(),choices=X.candidatesFor(data.observation,F.cells);
    var baselineRank=JSON.stringify(X.rankCandidates(choices,[],data.proposal.cellKey));
    var baselineProposal=JSON.stringify(data.proposal);
    installMemoryAdapter({});
    return baselineRank===JSON.stringify(X.rankCandidates(choices,[],data.proposal.cellKey,{memoryContext:{valid:true}}))&&
      baselineProposal===JSON.stringify(X.proposalForFeedback(data.feedback,[data.observation],F.cells,
        data.events,F.NOW,{memoryContext:{valid:true}}));
  });
  test('helpful confirmed memory is bounded to a plus point one preference',function(){
    installMemoryAdapter({second:memorySignal('helpful','preferred',0.8,false)});
    var ranked=X.rankCandidates([choice('first'),choice('second')],[],'lw',{memoryContext:{valid:true}});
    return ranked[0].candidate.strategyId==='second'&&ranked[0].memoryDelta===0.1&&ranked[0].rankScore===0.1;
  });
  test('helpful memory cannot flip a strategy with a negative base score',function(){
    installMemoryAdapter({second:memorySignal('negative','preferred',0.8,false)});
    var declined={type:'experiment_declined',payload:{strategyId:'second',cellKey:'lw'}};
    var ranked=X.rankCandidates([choice('first'),choice('second')],[declined],'lw',
      {memoryContext:{valid:true}});
    var second=ranked.filter(function(item){return item.candidate.strategyId==='second';})[0];
    return ranked[0].candidate.strategyId==='first'&&second.stats.score<0&&second.memoryDelta===undefined;
  });
  test('memory adapter receives cell-first scope with theme fallback',function(){
    installMemoryAdapter(function(context,candidate,scope){
      return candidate.strategyId==='second'&&(scope==='lw'||scope==='avoidance')?
        memorySignal('scoped','preferred',0.1,false):null;
    });
    var exactCell=X.rankCandidates([choice('first'),choice('second')],[],'lw',
      {memoryContext:{valid:true},themeId:'avoidance'});
    var fallbackTheme=X.rankCandidates([choice('first'),choice('second')],[],null,
      {memoryContext:{valid:true},themeId:'avoidance'});
    var other=X.rankCandidates([choice('first'),choice('second')],[],'money',
      {memoryContext:{valid:true},themeId:'avoidance'});
    return exactCell[0].candidate.strategyId==='second'&&fallbackTheme[0].candidate.strategyId==='second'&&
      other[0].candidate.strategyId==='first';
  });
  test('overlapping source evidence is passed through and receives no memory preference',function(){
    var data=source(),overlap=data.observation.evidenceEventIds[0];
    installMemoryAdapter(function(context,candidate,scope,sourceEvidenceIds){
      if(sourceEvidenceIds.indexOf(context.overlap)>=0)return null;
      return candidate.strategyId==='visible_finish'?memorySignal('overlap','preferred',0.1,false):null;
    });

      order.join('|')==='ff-reward-live|ff-reward-title|ff-reward-grid|ff-reward-support|ff-enter-hive'&&
      summary.querySelector('.ff-enter-hive').textContent==='ENTER THE HIVE'&&
      root.querySelectorAll('.ff-reward-excerpt').length===2&&
      ceremonyHTML.split('Private memory alpha zeta').length===2&&
      ceremonyHTML.split('Private memory beta zeta').length===2;
  });
  test('First Honey rejects unsafe labels and fails closed for malformed authority or geometry',function(){
    var unsafe='\"><img src=x onerror=alert(1) data-forged="yes">';
    var unsafeModel=firstFlightRewardModel({cellKey:'craft',label:unsafe});
    unsafeModel.cellLabel=unsafe;
    var unsafeSummary=U.renderFirstFlightRewardSummary(unsafeModel);
    var unsafeHost=document.createElement('div');
    unsafeHost.innerHTML=unsafeSummary;
    var unsafeCeremony=U.renderFirstFlightCombCeremony(
      unsafeModel,firstFlightCombGeometry(true),unsafeSummary);
    var valid=firstFlightRewardModel({cellKey:'craft',label:'Craft'});
    var validSummary=U.renderFirstFlightRewardSummary(valid);
    var geometry=firstFlightCombGeometry(true);
    var invalidModels=[null,{},[],
      Object.assign({},valid,{cellKey:' '}),
      Object.assign({},valid,{cellLabel:' '}),
      Object.assign({},valid,{unlocked:undefined}),
      Object.assign({},valid,{unlocked:{cellKey:'unknown',label:'Unknown'}}),
      Object.assign({},valid,{unlocked:{cellKey:'craft',label:' '}})
    ];
    var invalidGeometry=[null,[],{},
      Object.assign({},geometry,{width:0}),
      Object.assign({},geometry,{height:Infinity}),
      Object.assign({},geometry,{flightStartX:undefined}),
      Object.assign({},geometry,{flightStartY:NaN}),
      Object.assign({},geometry,{flightControlX:undefined}),
      Object.assign({},geometry,{targetX:undefined}),
      Object.assign({},geometry,{targetY:NaN})
    ];
    return unsafeSummary&&unsafeCeremony===''&&
      !unsafeHost.querySelector('img,script,[onerror],[data-forged]')&&
      unsafeHost.querySelector('.ff-reward-cell-label').textContent===unsafe&&
      unsafeHost.querySelector('.ff-reward-unlock').textContent.indexOf(unsafe)>=0&&
      invalidModels.every(function(model){
        return U.renderFirstFlightCombCeremony(model,geometry,validSummary)==='';
      })&&invalidGeometry.every(function(item){
        return U.renderFirstFlightCombCeremony(valid,item,validSummary)==='';
      })&&U.renderFirstFlightCombCeremony(valid,geometry,'')===''&&
      U.renderFirstFlightCombCeremony(
        valid,geometry,'<div data-first-flight-reward></div>')==='';
  });
  test('First Honey decorative stage introduces no chip, circuit, card, coin or XP metaphor',function(){
    var model=firstFlightRewardModel({cellKey:'craft',label:'Craft'});
    var summary=U.renderFirstFlightRewardSummary(model);
    box.innerHTML=U.renderFirstFlightCombCeremony(
      model,firstFlightCombGeometry(true),summary);
    var stage=box.querySelector('.ff-comb-stage');
    var ceremonyOnly=(stage.innerHTML+' '+stage.textContent).toLowerCase();
    return !/\b(?:chip|circuit|card|coin|xp)\b/.test(ceremonyOnly)&&
      !stage.querySelector(
        '[class*="chip"],[class*="circuit"],[class*="card"],[class*="coin"],[class*="xp"]');
  });

  test('proposal UI exposes try, edit, and not-now choices',function(){
    var data=source();box.innerHTML=U.renderProposal(data.proposal);
    return box.querySelectorAll('.td-exp-actions .td-exp-btn').length===3&&
      box.firstElementChild.getAttribute('tabindex')==='-1'&&!!box.querySelector('.td-exp-accept')&&
      !!box.querySelector('.td-exp-edit')&&!!box.querySelector('.td-exp-decline');
  });
  test('proposal edit fields are labelled and hidden initially',function(){
    var data=source();box.innerHTML=U.renderProposal(data.proposal);
    var editor=box.querySelector('.td-exp-editor'),button=box.querySelector('.td-exp-edit');
    return editor.hidden&&button.getAttribute('aria-controls')===editor.id&&
      editor.querySelectorAll('label').length===2&&editor.querySelectorAll('.td-exp-input[required]').length===2;
  });
  test('edit disclosure updates its accessible state',function(){
    var data=source();box.innerHTML=U.renderProposal(data.proposal);
    var button=box.querySelector('.td-exp-edit'),editor=box.querySelector('.td-exp-editor');
    return U.toggleEditor(button)===true&&!editor.hidden&&button.getAttribute('aria-expanded')==='true'&&
      U.toggleEditor(button)===false&&editor.hidden&&button.getAttribute('aria-expanded')==='false';
  });
  test('edit reader returns the current field values',function(){
    var data=source();box.innerHTML=U.renderProposal(data.proposal);
    box.querySelector('[data-exp-field="action"]').value='My changed action';
    box.querySelector('[data-exp-field="measure"]').value='My changed finish line';
    var edits=U.readEdits(box.firstElementChild);
    return edits.action==='My changed action'&&edits.measure==='My changed finish line';
  });
  test('experiment text is escaped before rendering',function(){
    var data=source(),unsafe=JSON.parse(JSON.stringify(data.proposal));
    unsafe.action='<img src=x onerror=alert(1)>';box.innerHTML=U.renderProposal(unsafe);
    return !box.querySelector('img')&&box.textContent.indexOf('<img src=x onerror=alert(1)>')>=0;
  });
  test('memory-guided proposals disclose that reviewed memory affected the recommendation',function(){
    var data=source(),guided=JSON.parse(JSON.stringify(data.proposal));
    guided.memoryGuidance=[provenance('display','preferred')];box.innerHTML=U.renderProposal(guided);
    return box.querySelector('.td-exp-source').textContent.indexOf('memory you reviewed')>=0;
  });
  test('memory-guided partly-true proposals keep the partial-read qualification',function(){
    var data=source(),guided=JSON.parse(JSON.stringify(data.proposal));
    guided.sourceVerdict='partly';guided.memoryGuidance=[provenance('partial_display','preferred')];
    box.innerHTML=U.renderProposal(guided);
    var text=box.querySelector('.td-exp-source').textContent;
    return text.indexOf('part of the read that held')>=0&&text.indexOf('memory you reviewed')>=0;
  });
  test('active experiment hides outcome choices before the due time',function(){
    var data=source(),active=JSON.parse(JSON.stringify(data.proposal));active.status='active';
    box.innerHTML=U.renderActive(active,F.NOW);
    var outcomes=box.querySelector('.td-exp-outcomes');
    return outcomes.hidden&&getComputedStyle(outcomes).display==='none'&&!!box.querySelector('.td-exp-report');
  });
  test('report-result disclosure reveals the four outcome choices',function(){
    var data=source(),active=JSON.parse(JSON.stringify(data.proposal));active.status='active';
    box.innerHTML=U.renderActive(active,F.NOW);
    var button=box.querySelector('.td-exp-report'),outcomes=box.querySelector('.td-exp-outcomes');
    return U.toggleOutcomes(button)===true&&!outcomes.hidden&&
      outcomes.querySelectorAll('.td-exp-outcome').length===4&&button.getAttribute('aria-expanded')==='true'&&
      button.getAttribute('aria-controls')===outcomes.id;
  });
  test('due experiments ask for an outcome immediately',function(){
    var data=source(),active=JSON.parse(JSON.stringify(data.proposal));active.status='active';
    box.innerHTML=U.renderActive(active,active.dueAt);
    return !box.querySelector('.td-exp-outcomes').hidden&&!box.querySelector('.td-exp-report')&&
      box.textContent.indexOf('The timebox is up')>=0;
  });
  test('completion closure explains how a no-change result is used',function(){
    var data=source(),event=experimentEvent('experiment_completed',X.completionPayload(data.proposal,'no_change'),1);
    box.innerHTML=U.renderClosed(event);
    return !!box.querySelector('.td-experiment-closed')&&box.textContent.indexOf('lower this kind of move')>=0;
  });

  if(location.search.indexOf('visual=')>=0){
    document.querySelector('h1').hidden=true;out.hidden=true;box.hidden=false;
    var preview=source();
    if(location.search.indexOf('visual=active')>=0){
      preview.proposal.status='active';box.innerHTML=U.renderActive(preview.proposal,F.NOW);
    }else box.innerHTML=U.renderProposal(preview.proposal);
  }

  out.innerHTML+='<div class="summary"><b>'+passed+' passed</b>, '+failed+' failed - '+
    Math.round(passed/(passed+failed)*100)+'% pass rate</div>';
})();
</script>
