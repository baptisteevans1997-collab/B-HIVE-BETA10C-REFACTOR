<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B HIVE app-main controlled harness</title>
<link rel="stylesheet" href="../css/app.css?first-flight-step3d">
<link rel="stylesheet" href="../css/beta-mobile-polish.css?navigation-consolidation">
<link rel="stylesheet" href="../css/beta-overlays.css?navigation-consolidation">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="id-block">B HIVE fixture</div>
    <nav class="nav" aria-label="Dashboard sections">
      <a href="#home">Home</a>
      <a href="#energy">Hive Mind</a>
      <a href="#system">Operating System</a>
      <a href="#brainmap">Brain Map</a>
      <a href="#bestiary">The Bestiary</a>
      <a href="#manual">Field Manual</a>
      <a href="#blueprints">Blueprints</a>
    </nav>

  <main class="main">

    <section class="section" id="energy">
      <div id="hive-today"></div>
      <div id="hive-level"></div>
      <div id="hive-mood"></div>
      <div id="hive-mbti"></div>
      <div class="hive-card">

      </div>
      <div id="hive-sheet-backdrop"></div>
      <div id="hive-sheet"><button class="hd-sheet-close" type="button">close</button>
        <div id="hive-detail"></div>
      </div>
      <div class="hive-bar">
        <button id="hive-log-btn" type="button">Check In</button>
        <span id="hive-last"></span>
        <button id="hive-manual-link" type="button">Field Manual</button>
        <button id="hive-report-toggle" type="button">Report</button>
        <button id="hive-log-toggle" type="button">History</button>
        <button id="hive-reset" type="button">Reset</button>
      </div>
      <div class="hive-io" id="hive-report" hidden><div id="report-body"></div></div>
      <div class="hive-log" id="hive-log" hidden></div>
    </section>
    <section class="section" id="system"></section>
    <section class="section" id="brainmap"></section>
    <section class="section" id="bestiary"><div id="bestiary-body"></div></section>
    <section class="section" id="manual"></section>
    <section class="section" id="blueprints"></section>

</div>

  <button class="navbar-action" id="mobile-nav-today" type="button"><span class="navbar-action-label">Today</span></button>
  <button class="navbar-action navbar-checkin" id="cmd-checkin" type="button"><span class="navbar-action-label">Check In</span></button>
  <button class="navbar-action" id="cmd-more" type="button" aria-haspopup="dialog" aria-controls="hive-cmdmenu" aria-expanded="false"><span class="navbar-action-label">More</span></button>
</nav>
<div class="hive-cmdmenu" id="hive-cmdmenu" role="dialog" aria-modal="true" aria-label="More" hidden>
  <div class="hive-cmdmenu-panel">
    <button class="hive-cmdmenu-close" type="button" aria-label="Close More menu">close</button>
    <div class="hive-cmdmenu-section" aria-label="Main">
      <div class="hive-cmdmenu-grid">
        <button class="cmd-tile" type="button" data-cmd="report"><span class="cmd-tile-label">Report</span></button>
        <button class="cmd-tile" type="button" data-cmd="history"><span class="cmd-tile-label">History</span></button>
        <button class="cmd-tile" type="button" data-cmd="bestiary"><span class="cmd-tile-label">Bestiary</span></button>
        <button class="cmd-tile" type="button" data-cmd="manual"><span class="cmd-tile-label">Field Manual</span></button>
      </div>

      <div class="hive-cmdmenu-support-grid">
        <button class="cmd-tile cmd-tile-wide" type="button" data-cmd="help"><span class="cmd-tile-label">Help / Restart Tour</span></button>
        <button class="cmd-tile cmd-tile-wide" type="button" data-cmd="finish"><span class="cmd-tile-label">Finish Beta &amp; Send Feedback</span></button>
      </div>

</div>
<div class="tour" id="tour" hidden><div class="tr-card"></div></div>
<button class="tour-open" id="tour-open" type="button">?</button>

<script>
(function () {
  'use strict';
  var scenario = new URLSearchParams(location.search).get('scenario') || 'widest';
  var storageKey = 'lw-brainmap-hive-v1';
  var completionReload = scenario === 'completion-reload';
  var freshEligible = [
    'fresh','fresh-wide','health-select','people-select','save-failure','answer-save-failure',
    'genuine-completion'
  ].indexOf(scenario) >= 0;
  var stagedFirstFlight = [
    'progress','completed','resume-selected','mission-ready','mission-active','mission-active-wide',
    'accept-save-failure','completion-save-failure','completion-no-reveal','completion-reload',
    'completion-stale','completion-malformed','completion-domain-failure','completion-throw',
    'completion-rerender'
  ].indexOf(scenario) >= 0;
  var isolatedFirstFlight = freshEligible || stagedFirstFlight;
  var keys = ['lw','free','craft','money','career','growth','finance','health','people','identity','clients','ink','side','recruit'];
  var current = {};
  keys.forEach(function (key) { current[key] = { imp: 50, en: 50 }; });
  current.health = { imp: 90, en: 20 };
  current.people = { imp: 70, en: 55 };
  if (scenario === 'locked') current.lw = { imp: 40, en: 20 };
  if (scenario === 'migration') {
    current.craft = { imp: 24, en: 12 };
    current.side = { imp: 22, en: 11 };
    current.recruit = { imp: 18, en: 9 };
  }

  var learnings = {};
  if (scenario === 'evolve') {
    learnings.lw = [
      {t:'fixture learning one',s:'you'}, {t:'fixture learning two',s:'you'},
      {t:'fixture learning three',s:'you'}, {t:'fixture learning four',s:'you'}
    ];
  } else if (scenario === 'migration') {
    learnings.craft = [{t:'migration-proven craft activity',s:'you'}];
  } else if (!isolatedFirstFlight) {
    learnings.craft = [
      {t:'legacy craft one',s:'you'}, {t:'legacy craft two',s:'you'},
      {t:'legacy craft three',s:'you'}, {t:'legacy craft four',s:'you'}
    ];
    learnings.health = [{t:'legacy health note',s:'you'}];
  }

  var fixture = {
    v: 3,
    ts: Date.now(),
    current: current,
    history: [{ts:Date.now(),cells:current}],
    learnings: learnings,
    agents: scenario === 'migration' ? {money:true} :
      (scenario === 'widest' || scenario === 'locked') ? {craft:true} : {},
    mbti: ['E','N','T','J'],
    swarms: scenario === 'migration' ?
      {lw:[{age:4,b:0.5,p:0.5}],craft:[{age:5,b:0.6,p:0.4}],free:[{age:8,b:0.3,p:0.7}]} :
      completionReload ? {lw:[],health:[],people:[]} :
      stagedFirstFlight ?
      {lw:[{age:6,b:0.4,p:0.6}],health:[{age:7,b:0.5,p:0.5}],people:[{age:8,b:0.6,p:0.4}]} :
      {lw:[{age:4,b:0.5,p:0.5}],craft:[{age:5,b:0.6,p:0.4}]},
    unlocks: scenario === 'completion-no-reveal' ? keys.slice() :
      scenario === 'locked' || stagedFirstFlight ? ['lw','health','people'] : keys.slice()
  };
  if (scenario === 'evolve' || scenario === 'widest' || scenario === 'normal-experiment' ||
      stagedFirstFlight || scenario === 'legacy-auto') fixture.unlockRevealVersion = 1;
  if (scenario === 'migration') fixture.learning = {
    modelVersion:1,
    events:[
      {id:'evt_harness_value_side',type:'cell_value_changed',ts:Date.now()-2,
        cellKey:'side',payload:{field:'en',from:10,to:11}},
      {id:'evt_harness_existing',type:'queen_message',ts:Date.now()-1,
        cellKey:null,payload:{role:'user',content:'preserve harness event'}}
    ],
    observations:[],hypotheses:[],experiments:[],feedback:[],insightQueue:[]
  };
  localStorage.removeItem(storageKey);
  localStorage.removeItem('lw-brainmap-queen-v1');
  localStorage.removeItem('bhive_beta_profile_answers');
  localStorage.removeItem('bhive_beta_profile_result');
  window.__HARNESS_STORAGE_CLEARED=localStorage.getItem(storageKey)===null;
  if (!freshEligible) localStorage.setItem(storageKey, JSON.stringify(fixture));
  window.__HARNESS_FOUNDATION_SWARMS = JSON.stringify({
    lw:fixture.swarms.lw||null,
    health:fixture.swarms.health||null,
    people:fixture.swarms.people||null
  });
  localStorage.removeItem('lw-brainmap-tour-v2');
  if (['fresh','fresh-wide','progress','completed','resume-selected','mission-ready',
      'mission-active','mission-active-wide','accept-save-failure','genuine-completion',
      'completion-save-failure','completion-no-reveal','completion-reload','completion-stale',
      'completion-malformed','completion-domain-failure','completion-throw',
      'completion-rerender','legacy-auto']
      .indexOf(scenario) < 0) {
    localStorage.setItem('lw-brainmap-tour-v2', '1');
  }

  window.__APP_MAIN_ERRORS = [];
  window.__CONFIRM_COUNT = 0;
  window.__CONFIRM_MESSAGE = '';
  window.__TODAY_SCROLLS = 0;
  window.__INDEX_SIGNATURE = null;
  window.__INDEX_ERROR = '';
  window.addEventListener('error', function (event) {
    window.__APP_MAIN_ERRORS.push(event.message || String(event.error));
  });
  window.addEventListener('unhandledrejection', function (event) {
    window.__APP_MAIN_ERRORS.push('unhandled rejection: ' + String(event.reason));
  });
  window.scrollTo = function () {};
  Element.prototype.scrollIntoView = function () {
    if (this.id === 'hive-today') window.__TODAY_SCROLLS++;
  };
  window.confirm = function (message) {
    window.__CONFIRM_COUNT++;
    window.__CONFIRM_MESSAGE = String(message || '');
    return false;
  };
  window.matchMedia = function (query) {
    var max = /max-width\s*:\s*(\d+)px/.exec(query);
    var min = /min-width\s*:\s*(\d+)px/.exec(query);
    var matches = query.indexOf('prefers-reduced-motion') !== -1;
    if (max) matches = innerWidth <= Number(max[1]);
    if (min) matches = innerWidth >= Number(min[1]);
    return {
      matches: matches,
      addEventListener: function () {}, removeEventListener: function () {},
      addListener: function () {}, removeListener: function () {}
    };
  };
  window.BHIVE_DATA = {
    DAYS:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
    MON:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
    SCREEN_NAMES:{
      home:'Home',energy:'Hive Mind',system:'Operating System',brainmap:'Brain Map',
      bestiary:'The Bestiary',manual:'Field Manual',blueprints:'Blueprints'
    },
    MBTI_CLASS:{ENTJ:'Fixture class'},
    TOUR:[{t:'Fixture tour',d:'Fixture help'}],
    WANDER:{
      'Builder Bees':{ax:0.5,ay:0.5,sBase:0.0001},
      'Scout Bees':{ax:0.5,ay:0.5,sBase:0.0001},
      'Forager Bees':{ax:0.5,ay:0.5,sBase:0.0001},
      'Guard Bees':{ax:0.5,ay:0.5,sBase:0.0001},
      'Nurse Bees':{ax:0.5,ay:0.5,sBase:0.0001},
      'Drones':{ax:0.5,ay:0.5,sBase:0.0001}
    }
  };

  fetch('../index.html?navigation-consolidation=' + Date.now(), {cache:'no-store'})
    .then(function (response) {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.text();
    })
    .then(function (html) {
      var page = new DOMParser().parseFromString(html, 'text/html');
      function values(selector, attribute) {
        return Array.prototype.map.call(page.querySelectorAll(selector), function (element) {
          return attribute ? element.getAttribute(attribute) : element.textContent.trim();
        });
      }
      var productionMenu = page.getElementById('hive-cmdmenu');
      window.__INDEX_SIGNATURE = {
        navbarCount: page.querySelectorAll('#navbar').length,
        navbarIds: values('#navbar > button', 'id'),
        navbarLabels: values('#navbar .navbar-action-label'),
        commandBarCount: page.querySelectorAll('.hive-cmdbar').length,
        legacyNavCount: page.querySelectorAll('#navmenu, #navmenu-btn').length,
        menuCount: page.querySelectorAll('#hive-cmdmenu').length,
        menuTopLevel: !!(productionMenu && !productionMenu.closest('.section')),
        mainCommands: values('#hive-cmdmenu [aria-label="Main"] [data-cmd]', 'data-cmd'),
        supportCommands: values('#hive-cmdmenu [aria-label="Support"] [data-cmd]', 'data-cmd'),
        dangerCommands: values('#hive-cmdmenu [aria-label="Danger"] [data-cmd]', 'data-cmd'),
        menuLabels: values('#hive-cmdmenu .cmd-tile-label'),
        placeholderCount: page.querySelectorAll(
          '#navbar [href="#projects"], #navbar [href="#strengths"], #navbar [href="#risks"], ' +
          '#navbar [href="#opportunities"], #navbar [href="#summary"], ' +
          '#hive-cmdmenu [href="#projects"], #hive-cmdmenu [href="#strengths"], ' +
          '#hive-cmdmenu [href="#risks"], #hive-cmdmenu [href="#opportunities"], ' +
          '#hive-cmdmenu [href="#summary"]').length,
        railRoutes: values('.rail .nav a', 'href'),
        manualProxyCount: page.querySelectorAll('#hive-manual-link').length,
        proxyTargetsPresent: [
          '#hive-log-btn','#hive-report-toggle','#hive-report.hive-io','#hive-log-toggle',
          '#hive-log.hive-log','#hive-manual-link','#tour-open','#hive-reset'
        ].every(function (selector) { return page.querySelectorAll(selector).length === 1; }),
        routeTargetsPresent: [
          '#home','#energy','#hive-today','#system','#brainmap','#bestiary','#manual','#blueprints'
        ].every(function (selector) { return page.querySelectorAll(selector).length === 1; })
      };
    })
    .catch(function (error) { window.__INDEX_ERROR = error.message; });
})();
</script>
<script src="../js/bhive-engine.js?first-flight-step3dp3"></script>
<script src="../js/bhive-learning.js"></script>
<script src="../js/bhive-experiments.js"></script>
<script>
(function () {
  'use strict';
  var scenario = new URLSearchParams(location.search).get('scenario') || 'widest';
  var storageKey = 'lw-brainmap-hive-v1';
  var staged = [
    'progress','completed','resume-selected','mission-ready','mission-active','mission-active-wide',
    'accept-save-failure','completion-save-failure','completion-no-reveal','completion-reload',
    'completion-stale','completion-malformed','completion-domain-failure','completion-throw',
    'completion-rerender'
  ].indexOf(scenario) >= 0;
  if (staged) {
    var fixture = JSON.parse(localStorage.getItem(storageKey));
    var B = window.BHIVE;
    var ts = 1700002000000;
    B.init();
    fixture.qver = 3;
    fixture.questions = JSON.parse(JSON.stringify(B.questions));
    fixture.questions.lw.push({q:'Preserve this resumable question',s:'claude'});
    B.recordEvent('first_flight_available', {ts:ts,payload:{version:1}});
    B.recordEvent('first_flight_cell_selected', {
      ts:ts+1,cellKey:'lw',payload:{version:1}
    });
    if (scenario !== 'resume-selected') {
      B.recordEvent('first_flight_answered', {
        ts:ts+2,cellKey:'lw',
        payload:{version:1,question:1,answer:'Finishing the beta matters most'}
      });
    }
    if (scenario === 'completed' || scenario === 'mission-ready' ||
        scenario === 'mission-active' || scenario === 'mission-active-wide' ||
        scenario === 'accept-save-failure' || scenario === 'completion-save-failure' ||
        scenario === 'completion-no-reveal' || scenario === 'completion-reload' ||
        scenario === 'completion-stale' || scenario === 'completion-malformed' ||
        scenario === 'completion-domain-failure' || scenario === 'completion-throw' ||
        scenario === 'completion-rerender') {
      B.recordEvent('first_flight_answered', {
        ts:ts+3,cellKey:'lw',
        payload:{version:1,question:2,answer:'Complete one focused beta task'}
      });
    }
    if (scenario === 'completed' || scenario === 'mission-active' ||
        scenario === 'mission-active-wide' || scenario === 'completion-save-failure' ||
        scenario === 'completion-no-reveal' || scenario === 'completion-reload' ||
        scenario === 'completion-stale' || scenario === 'completion-malformed' ||
        scenario === 'completion-domain-failure' || scenario === 'completion-throw' ||
        scenario === 'completion-rerender') {
      var ready = B.experiments.firstFlightState(B.learning.events);
      B.recordEvent('experiment_accepted', {
        id:'evt_harness_first_flight_accepted',ts:ts+4,cellKey:'lw',
        payload:B.experiments.decisionPayload(ready.mission,'accepted')
      });
    }
    if (scenario === 'completed') {
      B.recordEvent('experiment_completed', {
        id:'evt_first_flight_v1_completed_lw',ts:ts+5,cellKey:'lw',
        payload:B.experiments.completionPayload(ready.mission,'completed')
      });
    }
    if (scenario === 'completion-reload') {
      B.reconcileFirstFlightQuestions();
      B.cells.forEach(function(cell){B.swarms[cell.key]=[];});
      B.unlocks=B.UNLOCK_START.slice();
      var reloadActive=B.experiments.firstFlightState(B.learning.events);
      window.__HARNESS_RELOAD_SEED_RESULT=B.completeFirstFlight({
        storageKey:storageKey,
        mission:JSON.parse(JSON.stringify(reloadActive.mission)),
        cellKey:reloadActive.cellKey,
        answers:reloadActive.answers.slice(),
        now:ts+5
      });
    } else {
      fixture.learning = B.learning;
      localStorage.setItem(storageKey, JSON.stringify(fixture));
    }
  }
  if (scenario === 'normal-experiment') {
    fixture = JSON.parse(localStorage.getItem(storageKey));
    B = window.BHIVE;
    B.init();
    var normalNow=Date.now();
    var normalMission={
      experimentId:'exp_harness_normal',insightId:'obs_harness_normal',
      evidenceKey:'evt_harness_normal_evidence',
      evidenceEventIds:['evt_harness_normal_evidence'],observationKind:'trend',
      classification:'rising',themeId:null,cellKey:'lw',strategyId:'protected_block',
      action:'Take one normal action',measure:'Complete it and report back',durationDays:1,
      createdAt:normalNow-1000,dueAt:normalNow+86400000,sourceVerdict:'true',
      sourceRead:'A normal evidence-backed read'
    };
    B.recordEvent('experiment_accepted',{
      id:'evt_harness_normal_accepted',ts:normalNow,cellKey:'lw',
      payload:B.experiments.decisionPayload(normalMission,'accepted')
    });
    fixture.learning=B.learning;
    localStorage.setItem(storageKey,JSON.stringify(fixture));
    B.inference={};
    B.insightUI={latestFeedbackToday:function(){return null;}};
  }
  var stored = localStorage.getItem(storageKey);
  window.__HARNESS_STORED_HIVE = stored;
  window.__HARNESS_STORED_EVENTS = stored ?
    JSON.stringify((JSON.parse(stored).learning||{}).events||[]) : null;
  var originalSave = window.BHIVE.save;
  var originalComplete = window.BHIVE.completeFirstFlight;
  var originalAddLearning = window.BHIVE.addLearning;
  var originalUnlockFromAnswer = window.BHIVE.unlockFromAnswer;
  var originalSeedSwarms = window.BHIVE.seedSwarms;
  window.__HARNESS_SAVE_CALLS = 0;
  window.__HARNESS_SAVE_INSIDE_COMPLETE = 0;
  window.__HARNESS_SAVE_OUTSIDE_COMPLETE = 0;
  window.__HARNESS_COMPLETE_CALLS = 0;
  window.__HARNESS_COMPLETE_DEPTH = 0;
  window.__HARNESS_COMPLETE_REQUESTS = [];
  window.__HARNESS_COMPLETE_RESULTS = [];
  window.__HARNESS_BUSY_OBSERVATIONS = [];
  window.__HARNESS_REENTERED_COMPLETION = false;
  window.__HARNESS_FAIL_DOMAIN_ONCE = scenario === 'completion-domain-failure';
  window.__HARNESS_THROW_COMPLETION_ONCE = scenario === 'completion-throw';
  window.__HARNESS_ADD_LEARNING_CALLS = 0;
  window.__HARNESS_UNLOCK_CALLS = 0;
  window.__HARNESS_UNLOCK_REQUESTS = [];
  window.__HARNESS_ENGINE_SEED_CALLS = 0;
  window.__HARNESS_FAIL_SAVES = scenario === 'save-failure';
  window.__HARNESS_FAIL_ANSWER_SAVE = scenario === 'answer-save-failure';
  window.__HARNESS_FAIL_ACCEPT_SAVE = scenario === 'accept-save-failure';
  window.__HARNESS_FAIL_COMPLETION_SAVE = scenario === 'completion-save-failure';
  window.BHIVE.save = function(storageKey){
    window.__HARNESS_SAVE_CALLS++;
    if(window.__HARNESS_COMPLETE_DEPTH)window.__HARNESS_SAVE_INSIDE_COMPLETE++;
    else window.__HARNESS_SAVE_OUTSIDE_COMPLETE++;
    if(window.__HARNESS_FAIL_SAVES||
      (window.__HARNESS_FAIL_ANSWER_SAVE&&window.__HARNESS_SAVE_CALLS>1)||
      (window.__HARNESS_FAIL_ACCEPT_SAVE&&window.__HARNESS_SAVE_CALLS===1)||
      (window.__HARNESS_FAIL_COMPLETION_SAVE&&window.__HARNESS_COMPLETE_DEPTH))return false;
    return originalSave.call(window.BHIVE,storageKey);
  };
  window.BHIVE.completeFirstFlight = function(){
    window.__HARNESS_COMPLETE_CALLS++;
    window.__HARNESS_COMPLETE_REQUESTS.push(JSON.parse(JSON.stringify(arguments[0]||null)));
    var completeButton=document.querySelector('#hive-today .ff-complete');
    var busyObservation={
      buttonDisabled:!!completeButton&&completeButton.disabled,
      ariaBusy:completeButton&&completeButton.getAttribute('aria-busy'),
      reentrantClickBlocked:false,
      reentrantEnterBlocked:false,
      reentrantSpaceBlocked:false
    };
    if(completeButton){
      var callsBeforeReentry=window.__HARNESS_COMPLETE_CALLS;
      completeButton.disabled=false;
      completeButton.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
      busyObservation.reentrantClickBlocked=
        window.__HARNESS_COMPLETE_CALLS===callsBeforeReentry;
      completeButton.dispatchEvent(new KeyboardEvent('keydown',{
        key:'Enter',code:'Enter',bubbles:true,cancelable:true
      }));
      completeButton.dispatchEvent(new KeyboardEvent('keyup',{
        key:'Enter',code:'Enter',bubbles:true,cancelable:true
      }));
      completeButton.dispatchEvent(new MouseEvent('click',{
        bubbles:true,cancelable:true,detail:0
      }));
      busyObservation.reentrantEnterBlocked=
        window.__HARNESS_COMPLETE_CALLS===callsBeforeReentry;
      completeButton.dispatchEvent(new KeyboardEvent('keydown',{
        key:' ',code:'Space',bubbles:true,cancelable:true
      }));
      completeButton.dispatchEvent(new KeyboardEvent('keyup',{
        key:' ',code:'Space',bubbles:true,cancelable:true
      }));
      completeButton.dispatchEvent(new MouseEvent('click',{
        bubbles:true,cancelable:true,detail:0
      }));
      busyObservation.reentrantSpaceBlocked=
        window.__HARNESS_COMPLETE_CALLS===callsBeforeReentry;
      completeButton.disabled=true;
      window.__HARNESS_REENTERED_COMPLETION=true;
    }
    window.__HARNESS_BUSY_OBSERVATIONS.push(busyObservation);
    window.__HARNESS_COMPLETE_DEPTH++;
    try{
      var result;
      if(window.__HARNESS_FAIL_DOMAIN_ONCE){
        window.__HARNESS_FAIL_DOMAIN_ONCE=false;
        result={ok:false,reason:'domain_rejected'};
      }else if(window.__HARNESS_THROW_COMPLETION_ONCE){
        window.__HARNESS_THROW_COMPLETION_ONCE=false;
        throw new Error('fixture completion exception');
      }else{
        result=originalComplete.apply(window.BHIVE,arguments);
      }
      window.__HARNESS_COMPLETE_RESULTS.push(JSON.parse(JSON.stringify(result)));
      return result;
    }finally{
      window.__HARNESS_COMPLETE_DEPTH--;
    }
  };
  window.BHIVE.addLearning = function(){
    window.__HARNESS_ADD_LEARNING_CALLS++;
    return originalAddLearning.apply(window.BHIVE,arguments);
  };

          activeAction:(document.querySelector('#hive-today .ff-mission-action')||{}).textContent||'',
          activeInProgress:(document.querySelector('#hive-today .ff-progress')||{}).textContent||'',
          activeCompletionOnly:!!ffActiveCard&&
            ffActiveCard.querySelectorAll('button,textarea,input,select').length===1&&
            ffActiveCard.querySelectorAll('.ff-complete').length===1&&
            ffActiveCard.querySelector('.ff-complete').textContent==='Complete First Mission'&&
            ffActiveCard.querySelector('.ff-complete').tabIndex===0&&
            !ffActiveCard.querySelector('.ff-complete').disabled&&
            !ffActiveCard.querySelector(
              '.td-exp-accept,.td-exp-edit,.td-exp-outcome,.td-exp-decline,.td-exp-report'),
          activeFocused:document.activeElement===ffActiveCard,
          interfaceCount:document.querySelectorAll('#hive-today [data-first-flight]').length,
          acceptedEventCount:ffAcceptedEvents.length,
          canonicalAcceptance:ffAcceptedEvents.length===1&&
            ffAcceptedEvents[0].cellKey==='lw'&&
            JSON.stringify(ffAcceptedEvents[0].payload)===JSON.stringify(ffExpectedAcceptance),
          saveCalls:window.__HARNESS_SAVE_CALLS-ffAcceptSaveStart,
          protectedStateUnchanged:ffReadyBefore===ffProtectedSnapshot(),
          answerEventsUnchanged:ffAnswerEventsBefore===JSON.stringify(
            window.BHIVE.learning.events.filter(function(event){
              return event.type==='first_flight_answered';
            })),
          noLearningEvents:ffEventCount('learning_added')===0,
          addLearningCalls:window.__HARNESS_ADD_LEARNING_CALLS,
          unlockCalls:window.__HARNESS_UNLOCK_CALLS,
          noCompletedEvents:ffEventCount('experiment_completed')===0,
          zeroStrategyEvidence:ffActiveStats.completed===0&&ffActiveStats.declined===0&&
            ffActiveStats.score===0,
          completionOperationCalls:window.__HARNESS_COMPLETE_CALLS
        };
      }else if(scenario==='mission-active'||scenario==='mission-active-wide'){
        var ffReloadActive=ffState();
        var ffReloadActiveCard=document.querySelector(
          '#hive-today [data-first-flight-state="mission_active"]');
        var ffActiveTourHelp=document.getElementById('tour-open');
        if(ffActiveTourHelp)ffActiveTourHelp.click();
        result.onboardingCoordination.manualHelpOpened=!!ffTour&&!ffTour.hidden;
        var ffActiveTourClose=ffTour&&ffTour.querySelector('.tr-skip');
        if(ffActiveTourClose)ffActiveTourClose.click();
        result.firstFlightFlow={
          status:ffReloadActive&&ffReloadActive.status,
          acceptedEventId:ffReloadActive&&ffReloadActive.acceptedEventId,
          acceptedEventCount:ffEventCount('experiment_accepted'),
          title:(document.querySelector('#hive-today .ff-mission h3')||{}).textContent||'',
          action:(document.querySelector('#hive-today .ff-mission-action')||{}).textContent||'',
          heading:(document.querySelector('#hive-today .ff-title')||{}).textContent||'',
          inProgress:(document.querySelector('#hive-today .ff-progress')||{}).textContent||'',
          completionOnly:!!ffReloadActiveCard&&
            ffReloadActiveCard.querySelectorAll('button,textarea,input,select').length===1&&
            ffReloadActiveCard.querySelectorAll('.ff-complete').length===1&&
            ffReloadActiveCard.querySelector('.ff-complete').textContent===
              'Complete First Mission'&&
            ffReloadActiveCard.querySelector('.ff-complete').type==='button'&&
            !ffReloadActiveCard.querySelector(
              '.td-exp-accept,.td-exp-edit,.td-exp-outcome,.td-exp-decline,.td-exp-report'),
          completionFocusable:!!ffReloadActiveCard&&
            ffReloadActiveCard.querySelector('.ff-complete').tabIndex===0,
          interfaceCount:document.querySelectorAll('#hive-today [data-first-flight]').length,
          eventsPreserved:window.__HARNESS_STORED_EVENTS===
            JSON.stringify(window.BHIVE.learning.events),
          startupSaveCalls:window.__HARNESS_SAVE_CALLS,
          completionOperationCalls:window.__HARNESS_COMPLETE_CALLS,
          addLearningCalls:window.__HARNESS_ADD_LEARNING_CALLS,
          unlockCalls:window.__HARNESS_UNLOCK_CALLS
        };
      }else if(scenario==='accept-save-failure'){
        var ffAcceptFailureReady=ffState();
        var ffAcceptFailureBefore=ffProtectedSnapshot();
        var ffAcceptFailureEvents=JSON.stringify(window.BHIVE.learning.events);
        var ffAcceptFailureStored=localStorage.getItem(storageKey);
        var ffAcceptFailureAnswers=JSON.stringify(window.BHIVE.learning.events.filter(function(event){
          return event.type==='first_flight_answered';
        }));
        var ffAcceptFailureExpected=window.BHIVE.experiments.decisionPayload(
          ffAcceptFailureReady.mission,'accepted');
        var ffAcceptFailureButton=document.querySelector('#hive-today .ff-begin');
        ffAcceptFailureButton.click();
        var ffAfterFailedAccept=ffState(),ffFailedSaved=ffSavedState();
        var ffRetryButton=document.querySelector('#hive-today .ff-begin');
        var ffFailureError=/could not save/.test(
          (document.querySelector('#hive-today .ff-status')||{}).textContent||'');
        var ffFailureLive=document.querySelector(
          '#hive-today .ff-status[role="status"][aria-live="polite"][aria-atomic="true"]');
        var ffFailureFocus=document.activeElement===ffRetryButton;
        var ffFailureAcceptedCount=ffEventCount('experiment_accepted');
        var ffFailureEventsRestored=ffAcceptFailureEvents===
          JSON.stringify(window.BHIVE.learning.events);
        var ffFailureStoredRestored=ffAcceptFailureStored===localStorage.getItem(storageKey);
        ffRetryButton.click();
        var ffAfterRetry=ffState(),ffRetrySaved=ffSavedState();
        var ffRetryAccepted=window.BHIVE.learning.events.filter(function(event){
          return event.type==='experiment_accepted';
        });
        var ffRetryActiveCard=document.querySelector(
          '#hive-today [data-first-flight-state="mission_active"]');
        result.firstFlightFlow={
          failedStatus:ffAfterFailedAccept&&ffAfterFailedAccept.status,
          failedSavedStatus:ffFailedSaved&&ffFailedSaved.status,
          failedAcceptedEventCount:ffFailureAcceptedCount,
          failureError:ffFailureError,
          failureLiveRegion:!!ffFailureLive&&ffFailureLive.classList.contains('is-error'),
          failureFocus:ffFailureFocus,
          failureEventsRestored:ffFailureEventsRestored,
          failureStoredRestored:ffFailureStoredRestored,
          retryStatus:ffAfterRetry&&ffAfterRetry.status,
          retrySaved:ffRetrySaved&&ffRetrySaved.status==='mission_active',
          retryAcceptedEventCount:ffRetryAccepted.length,
          retryCanonical:ffRetryAccepted.length===1&&
            JSON.stringify(ffRetryAccepted[0].payload)===JSON.stringify(ffAcceptFailureExpected),
          saveCalls:window.__HARNESS_SAVE_CALLS,
          protectedStateUnchanged:ffAcceptFailureBefore===ffProtectedSnapshot(),
          answerEventsUnchanged:ffAcceptFailureAnswers===JSON.stringify(
            window.BHIVE.learning.events.filter(function(event){
              return event.type==='first_flight_answered';
            })),
          noLearningEvents:ffEventCount('learning_added')===0,
          addLearningCalls:window.__HARNESS_ADD_LEARNING_CALLS,
          unlockCalls:window.__HARNESS_UNLOCK_CALLS,
          noCompletedEvents:ffEventCount('experiment_completed')===0,
          completionOperationCalls:window.__HARNESS_COMPLETE_CALLS,
          retryFocused:document.activeElement===ffRetryActiveCard
        };
      }else if(scenario==='save-failure'){
        var ffFailureBefore=ffProtectedSnapshot();
        var ffFailureButton=document.querySelector(
          '#hive-today .ff-cell-choice[data-cell-key="lw"]');
        ffFailureButton.click();
        var ffFailureState=ffState();
        result.firstFlightFlow={
          status:ffFailureState&&ffFailureState.status,
          selectionEventCount:ffEventCount('first_flight_cell_selected'),
          saveCalls:window.__HARNESS_SAVE_CALLS,
          storageAbsent:localStorage.getItem(storageKey)===null,
          protectedStateUnchanged:ffFailureBefore===ffProtectedSnapshot(),
          openingStillVisible:(document.querySelector('#hive-today .ff-title')||{}).textContent===
            'What needs your attention most right now?',
          recoverableError:/could not save/.test(
            (document.querySelector('#hive-today .ff-status')||{}).textContent||''),
          focusReturned:document.activeElement&&
            document.activeElement.getAttribute('data-cell-key')==='lw'
        };
      }else if(scenario==='answer-save-failure'){
        var ffAnswerFailureButton=document.querySelector(
          '#hive-today .ff-cell-choice[data-cell-key="lw"]');
        ffAnswerFailureButton.click();
        var ffAnswerFailureBefore=ffProtectedSnapshot();
        ffSetAnswer('Keep this answer recoverable');
        ffSubmit(document.querySelector('#hive-today .ff-form'));
        var ffAnswerFailureState=ffState();
        var ffAnswerFailureSaved=ffSavedState();
        var ffRestoredInput=document.querySelector('#hive-today .ff-answer');
        result.firstFlightFlow={
          status:ffAnswerFailureState&&ffAnswerFailureState.status,
          selectionEventCount:ffEventCount('first_flight_cell_selected'),
          answerEventCount:ffEventCount('first_flight_answered'),
          saveCalls:window.__HARNESS_SAVE_CALLS,
          savedStatus:ffAnswerFailureSaved&&ffAnswerFailureSaved.status,
          protectedStateUnchanged:ffAnswerFailureBefore===ffProtectedSnapshot(),
          answerRestored:ffRestoredInput&&
            ffRestoredInput.value==='Keep this answer recoverable',
          recoverableError:/could not save/.test(
            (document.querySelector('#hive-today .ff-status')||{}).textContent||''),
          focusReturned:document.activeElement===ffRestoredInput
        };
      }else if(scenario==='normal-experiment'){
        var normalActive=window.BHIVE.experiments.activeExperiment(window.BHIVE.learning.events);
        var normalPanel=document.querySelector('#hive-today .td-exp-active');
        var normalReport=document.querySelector('#hive-today .td-exp-report');
        if(normalReport)normalReport.click();
        var normalOutcome=document.querySelector(
          '#hive-today .td-exp-outcome[data-outcome="helped"]');
        var normalReportExpanded=!!normalReport&&
          normalReport.getAttribute('aria-expanded')==='true'&&
          !!normalOutcome&&normalOutcome.getClientRects().length>0;
        var normalSaveStart=window.__HARNESS_SAVE_CALLS;
        var normalInsideStart=window.__HARNESS_SAVE_INSIDE_COMPLETE;
        var normalOutsideStart=window.__HARNESS_SAVE_OUTSIDE_COMPLETE;
        var normalCompleteStart=window.__HARNESS_COMPLETE_CALLS;
        if(normalOutcome)normalOutcome.click();
        var normalCompletions=window.BHIVE.learning.events.filter(function(event){
          return event.type==='experiment_completed'&&
            event.payload&&event.payload.experimentId==='exp_harness_normal';
        });
        var normalLifecycle=window.BHIVE.experiments.lifecycle(
          window.BHIVE.learning.events,'exp_harness_normal');
        var normalStats=window.BHIVE.experiments.strategyStats(
          window.BHIVE.learning.events,'protected_block','lw');
        var normalClosed=document.querySelector('#hive-today .td-experiment-closed');
        var normalSaved=JSON.parse(localStorage.getItem(storageKey));
        result.normalExperiment={
          activeRendered:!!normalPanel&&!!normalActive&&
            normalActive.experimentId==='exp_harness_normal'&&
            (normalPanel.querySelector('.td-exp-action')||{}).textContent==='Take one normal action',
          outcomeControl:!!normalOutcome&&normalOutcome.textContent==='Yes',
          reportExpanded:normalReportExpanded,
          completionCount:normalCompletions.length,
          helpedOutcome:normalCompletions.length===1&&normalCompletions[0].payload.outcome==='helped',
          completedLifecycle:normalLifecycle&&normalLifecycle.status==='completed'&&
            normalLifecycle.outcome==='helped',
          positiveStrategyEvidence:normalStats.completed===1&&normalStats.score>0,
          saveCalls:window.__HARNESS_SAVE_CALLS-normalSaveStart,
          insideFirstFlightSaveCalls:window.__HARNESS_SAVE_INSIDE_COMPLETE-normalInsideStart,
          ordinaryUiSaveCalls:window.__HARNESS_SAVE_OUTSIDE_COMPLETE-normalOutsideStart,
          firstFlightCompletionCalls:window.__HARNESS_COMPLETE_CALLS-normalCompleteStart,
          closedFocused:!!normalClosed&&document.activeElement===normalClosed,
          closedCopy:normalClosed&&/Useful/.test(normalClosed.textContent),
          storedMatchesLive:!!normalSaved&&JSON.stringify(normalSaved.learning.events)===
            JSON.stringify(window.BHIVE.learning.events),
          firstFlightControlsAbsent:!document.querySelector('#hive-today [data-first-flight], #hive-today .ff-complete')
        };
      }

      if (scenario === 'evolve') {
        var navbar = document.getElementById('navbar');
        var menu = document.getElementById('hive-cmdmenu');
        var help = document.getElementById('tour-open');
        var finish = document.getElementById('bhtm-fin');
        clickRail('#bestiary');
        document.getElementById('mobile-nav-hive').click();
        var hiveRoute = activeScreen() === 'energy';

        clickRail('#bestiary');
        document.getElementById('mobile-nav-today').click();
        var todayRoute = activeScreen() === 'energy' && window.__TODAY_SCROLLS === 1;

        var beforeCheckin = JSON.parse(localStorage.getItem(storageKey));
        clickRail('#bestiary');
        document.getElementById('cmd-checkin').click();
        var afterCheckin = JSON.parse(localStorage.getItem(storageKey));
        var checkinRoute = activeScreen() === 'energy' &&
          afterCheckin.history.length === beforeCheckin.history.length + 1 &&
          !!document.getElementById('hive-last').textContent.trim();

        clickRail('#bestiary');
        document.getElementById('cmd-more').click();
        var visibleMenus = Array.prototype.filter.call(
          document.querySelectorAll('#hive-cmdmenu'), visible).length;
        var menuFromOtherScreen = activeScreen() === 'bestiary' && visible(menu);
        var menuLabels = Array.prototype.map.call(menu.querySelectorAll('.cmd-tile-label'),
          function (label) { return label.textContent.trim(); });
        var menuTilesVisible = Array.prototype.every.call(menu.querySelectorAll('[data-cmd]'), visible);
        var mainCommands = Array.prototype.map.call(
          menu.querySelectorAll('[aria-label="Main"] [data-cmd]'),
          function (tile) { return tile.getAttribute('data-cmd'); });
        var supportCommands = Array.prototype.map.call(
          menu.querySelectorAll('[aria-label="Support"] [data-cmd]'),
          function (tile) { return tile.getAttribute('data-cmd'); });
        var dangerCommands = Array.prototype.map.call(
          menu.querySelectorAll('[aria-label="Danger"] [data-cmd]'),
          function (tile) { return tile.getAttribute('data-cmd'); });
        var resetTile = menu.querySelector('[data-cmd="reset"]');
        var resetSeparated = !!(resetTile && resetTile.closest('.hive-cmdmenu-danger'));
        var placeholderLinks = document.querySelectorAll(
          '#navbar a[href="#projects"], #navbar a[href="#strengths"], #navbar a[href="#risks"], ' +
          '#navbar a[href="#opportunities"], #navbar a[href="#summary"], ' +
          '#hive-cmdmenu a[href="#projects"], #hive-cmdmenu a[href="#strengths"], ' +
          '#hive-cmdmenu a[href="#risks"], #hive-cmdmenu a[href="#opportunities"], ' +
          '#hive-cmdmenu a[href="#summary"]');
        menu.querySelector('.hive-cmdmenu-close').click();

        openCommand('report');
        var reportRoute = activeScreen() === 'energy' && visible(document.getElementById('hive-report'));
        openCommand('history');
        var historyRoute = activeScreen() === 'energy' && visible(document.getElementById('hive-log'));
        openCommand('bestiary');
        var bestiaryRoute = activeScreen() === 'bestiary';
        openCommand('manual');
        var manualRoute = activeScreen() === 'manual';

        openCommand('help');
        var helpRoute = visible(document.getElementById('tour'));
        var tourClose = document.querySelector('#tour .tr-skip');
        if (tourClose) tourClose.click();
        openCommand('finish');
        var finishRoute = visible(document.getElementById('bhtm-finish'));
        var finishCancel = Array.prototype.filter.call(
          document.querySelectorAll('#bhtm-finish button'),
          function (button) { return button.textContent.trim() === 'Not yet'; })[0];
        if (finishCancel) finishCancel.click();
        var beforeReset = localStorage.getItem(storageKey);
        var beforeResetCells = JSON.stringify(window.BHIVE.cells.map(function (cell) {
          return [cell.key,cell.imp,cell.en];
        }));
        openCommand('reset');
        var resetRoute = window.__CONFIRM_COUNT === 1 &&
          /^Reset/.test(window.__CONFIRM_MESSAGE) && localStorage.getItem(storageKey) === beforeReset &&
          JSON.stringify(window.BHIVE.cells.map(function (cell) {
            return [cell.key,cell.imp,cell.en];
          })) === beforeResetCells;

        result.navigation.mobile = {
          navbarVisible: visible(navbar),
          desktopNavHidden: !visible(document.querySelector('.nav')),
          navbarButtonsVisible: Array.prototype.every.call(
            navbar.querySelectorAll('.navbar-action'), visible),
          labels: Array.prototype.map.call(navbar.querySelectorAll('.navbar-action-label'),
            function (label) { return label.textContent.trim(); }),
          commandBarCount: document.querySelectorAll('.hive-cmdbar').length,
          menuCount: document.querySelectorAll('#hive-cmdmenu').length,
          visibleMenus: visibleMenus,
          menuFromOtherScreen: menuFromOtherScreen,
          menuLabels: menuLabels,
          menuTilesVisible: menuTilesVisible,
          mainCommands: mainCommands,
          supportCommands: supportCommands,
          dangerCommands: dangerCommands,
          resetSeparated: resetSeparated,
          placeholdersAbsent: placeholderLinks.length === 0,
          helpHidden: !visible(help),
          finishHidden: !!finish && !visible(finish),
          primaryRoutes: hiveRoute && todayRoute && checkinRoute,
          mainRoutes: reportRoute && historyRoute && bestiaryRoute && manualRoute,
          supportRoutes: helpRoute && finishRoute,
          resetRoute: resetRoute
        };
      } else if (scenario === 'widest') {
        var rail = document.querySelector('.rail');
        var desktopNav = document.querySelector('.nav');
        var routeLinks = Array.prototype.slice.call(desktopNav.querySelectorAll('a'));
        var expectedRoutes = ['home','energy','system','brainmap','bestiary','manual','blueprints'];
        var reachedRoutes = routeLinks.map(function (link) {
          link.click();
          return activeScreen();
        });
        result.navigation.desktop = {
          railVisible: visible(rail),
          navVisible: visible(desktopNav),
          linksVisible: routeLinks.length === 7 && routeLinks.every(visible),
          navIsColumn: getComputedStyle(desktopNav).flexDirection === 'column',
          bottomHidden: !visible(document.getElementById('navbar')),
          commandBarCount: document.querySelectorAll('.hive-cmdbar').length,
          moreHidden: !visible(document.getElementById('hive-cmdmenu')),
          helpVisible: visible(document.getElementById('tour-open')),
          manualProxyHidden: !visible(document.getElementById('hive-manual-link')),
          finishHidden: !!document.getElementById('bhtm-fin') &&
            !visible(document.getElementById('bhtm-fin')),
          liveRoutes: expectedRoutes.join('|') === reachedRoutes.join('|')
        };
      }
    } catch (navigationError) {
      result.errors.push('navigation: ' + navigationError.message);
    }

    if (scenario === 'widest') {
      var mbtiButton = document.querySelector('#hive-mbti .mb-ax');
      if (mbtiButton) mbtiButton.click();
      var saved = JSON.parse(localStorage.getItem(storageKey));
      result.savedAgain = !!(saved && saved.agents && saved.mbti && saved.swarms && saved.learnings);
      var core = document.querySelector('#hivesvg .hive-core');
      if (core) core.dispatchEvent(new MouseEvent('click', {bubbles:true}));
      result.priorityClass = !!document.querySelector('#hivesvg .hive-cell.priority-on');
    } else if (scenario === 'locked') {
      var lockedKey = 'craft';
      var lockedCellBefore = document.querySelector(
        '#hivesvg .hive-cell[data-cell-key="' + lockedKey + '"]');
      var lockedWorkerBefore = document.querySelector(
        '#hivesvg .hive-workers [data-cell-key="' + lockedKey + '"]');
      var unlockedCellBefore = document.querySelector(
        '#hivesvg .hive-cell[data-cell-key="health"]');
      var dormantUnlockedBefore = document.querySelector(
        '#hivesvg .hive-cell[data-cell-key="lw"].hv-dormant');
      var focusableKeysBefore = Array.prototype.map.call(
        document.querySelectorAll('#hivesvg .hive-cell[tabindex]'),
        function (cell) { return cell.getAttribute('data-cell-key'); });

      var sourceCell = document.querySelector('#hivesvg .hive-cell[data-cell-key="lw"]');
      if (sourceCell) sourceCell.dispatchEvent(new MouseEvent('click', {bubbles:true}));
      var teachInput = document.querySelector('#hive-detail .hd-learn-in');
      var teachButton = document.querySelector('#hive-detail .hd-learn-add');
      if (teachInput) teachInput.value = 'building a new project';
      if (teachButton) teachButton.click();

      var unlockedCellAfter = document.querySelector(
        '#hivesvg .hive-cell[data-cell-key="' + lockedKey + '"]');
      var savedAfterUnlock = JSON.parse(localStorage.getItem(storageKey));
      result.lockedVisibility = {
        lockedHidden: !lockedCellBefore && !lockedWorkerBefore,
        unlockedVisible: !!unlockedCellBefore,
        dormantUnlockedVisible: !!dormantUnlockedBefore,
        coreVisible: !!document.querySelector('#hivesvg .hive-core'),
        hiddenNotInteractive: focusableKeysBefore.indexOf(lockedKey) === -1,
        appearedAfterUnlock: window.BHIVE.isUnlocked(lockedKey) && !!unlockedCellAfter,
        appearedInteractive: !!unlockedCellAfter &&
          unlockedCellAfter.getAttribute('tabindex') === '0' &&
          unlockedCellAfter.getAttribute('role') === 'button',
        stateStillComplete: window.BHIVE.cells.length === 14,
        savePreservedUnlocks: !!(savedAfterUnlock && savedAfterUnlock.current &&
          savedAfterUnlock.current[lockedKey] && savedAfterUnlock.unlocks &&
          savedAfterUnlock.unlocks.indexOf(lockedKey) !== -1)
      };
    } else if (scenario === 'migration') {
      var migratedHiddenKey = 'free';
      var revealKey = 'recruit';
      var hiddenCellBefore = document.querySelector(
        '#hivesvg .hive-cell[data-cell-key="' + migratedHiddenKey + '"]');
      var hiddenWorkerBefore = document.querySelector(
        '#hivesvg .hive-workers [data-cell-key="' + migratedHiddenKey + '"]');
      var taughtDormantBefore = document.querySelector(
        '#hivesvg .hive-cell[data-cell-key="craft"].hv-dormant');
      var changedDormantBefore = document.querySelector(
        '#hivesvg .hive-cell[data-cell-key="side"].hv-dormant');
      var originalEventPreserved = window.BHIVE.learning.events.some(function(event){
        return event.id === 'evt_harness_existing';
      });
      var migratedBefore = {
        exactUnlocks: window.BHIVE.unlocks.join('|') === 'lw|health|people|craft|money|side',
        hiddenUnused: !hiddenCellBefore && !hiddenWorkerBefore,
        provenDormantVisible: !!taughtDormantBefore && !!changedDormantBefore,
        coreVisible: !!document.querySelector('#hivesvg .hive-core'),
        versioned: window.BHIVE.unlockRevealVersion === 1,
        dataPreserved: window.BHIVE.cells.length === 14 &&
          window.BHIVE.learnings.craft[0].t === 'migration-proven craft activity' &&
          window.BHIVE.agents.money === true && window.BHIVE.history.length === 1 &&
          window.BHIVE.swarms.free[0].age === 8 && originalEventPreserved
      };

      var migrationSource = document.querySelector('#hivesvg .hive-cell[data-cell-key="lw"]');
      if (migrationSource) migrationSource.dispatchEvent(new MouseEvent('click', {bubbles:true}));
      var migrationInput = document.querySelector('#hive-detail .hd-learn-in');
      var migrationTeach = document.querySelector('#hive-detail .hd-learn-add');
      if (migrationInput) migrationInput.value = 'building a new project';
      if (migrationTeach) migrationTeach.click();

      var revealedAfter = document.querySelector(
        '#hivesvg .hive-cell[data-cell-key="' + revealKey + '"].hv-dormant');
      var hiddenStillAfter = document.querySelector(
        '#hivesvg .hive-cell[data-cell-key="' + migratedHiddenKey + '"]');
      var migratedSaved = JSON.parse(localStorage.getItem(storageKey));
      result.migrationVisibility = {
        exactUnlocks: migratedBefore.exactUnlocks,
        hiddenUnused: migratedBefore.hiddenUnused,
        provenDormantVisible: migratedBefore.provenDormantVisible,
        coreVisible: migratedBefore.coreVisible,
        versioned: migratedBefore.versioned && !!migratedSaved &&
          migratedSaved.unlockRevealVersion === 1,
        dataPreserved: migratedBefore.dataPreserved,
        newlyRevealedImmediately: window.BHIVE.isUnlocked(revealKey) && !!revealedAfter,
        revealedDormantVisible: !!revealedAfter && revealedAfter.getAttribute('tabindex') === '0',
        otherHiddenStillHidden: !hiddenStillAfter,
        savePreservedReveal: !!(migratedSaved && migratedSaved.unlocks &&
          migratedSaved.unlocks.indexOf(revealKey) !== -1)
      };
    }
    parent.postMessage({type:'bhive-app-main-result',result:result}, location.origin);
  }

  /* manual=1 leaves the staged page idle for an external browser to send trusted keys.
     At 390x844 and 1600x900, load mission-active, wait for .ff-complete, Tab to it,
     verify :focus-visible and its outline, then press Enter. Reload an isolated page
     before repeating with Space because successful completion removes the control. */
  if(new URLSearchParams(location.search).get('manual')!=='1')finishWhenReady();
})());
</script>
