<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B HIVE — app-main Integration Tests</title>
<style>
  body { background:#15120c; color:#ece4d2; font:14px/1.6 system-ui,sans-serif; max-width:760px; margin:40px auto; padding:0 20px; }
  h1 { color:#c9ae78; font-size:20px; border-bottom:1px solid rgba(237,228,210,.1); padding-bottom:10px; }
  .test { padding:6px 10px; margin:3px 0; border-radius:4px; font:12px/1.5 ui-monospace,monospace; }
  .pass { background:rgba(148,160,109,.15); color:#a3b07f; }
  .fail { background:rgba(207,140,84,.2); color:#cf8c54; }
  .summary { margin-top:24px; padding:12px; border:1px solid #c9ae78; border-radius:8px; }
  iframe { position:absolute; width:1px; height:1px; border:0; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<h1>B HIVE app-main Integration Tests</h1>
<div id="results"></div>
<div id="summary" class="summary">Running controlled browser scenarios…</div>
<script>
(function () {
  'use strict';
  var results = document.getElementById('results');
  var summary = document.getElementById('summary');
  var passed = 0, failed = 0, uncaught = [];
  var scenarios = [
    'fresh','fresh-wide','health-select','people-select','resume-selected',
    'progress','mission-ready','mission-active','mission-active-wide','accept-save-failure',
    'save-failure','answer-save-failure','genuine-completion','completion-reload',
    'completion-save-failure','completion-no-reveal','completion-stale',
    'completion-malformed','completion-domain-failure','completion-throw',
    'completion-rerender','completion-invalid-worker','completion-invalid-learning',
    'completion-invalid-completion','completion-already-result','completion-presentation-throw',
    'completion-presentation-dispose',
    'comb-awakened','comb-awakened-small','comb-awakened-wide','comb-no-unlock','comb-skip','comb-skip-impact','comb-skip-build',
    'comb-background','comb-watchdog','comb-animationcancel','comb-pagehide','comb-render-failure','comb-reduced',
    'comb-enter',
    'completion-private-copy','normal-experiment','completed','completed-elder','completed-zero',
    'legacy-auto','evolve','widest',
    'locked','migration'
  ];
  var reports = {};
  var activeFrame = null, activeScenario = '', scenarioTimer = 0, nextScenario = 0;

  window.addEventListener('error', function (event) { uncaught.push(event.message); });
  window.addEventListener('unhandledrejection', function (event) { uncaught.push(String(event.reason)); });

  function test(name, ok, detail) {
    var row = document.createElement('div');
    row.className = 'test ' + (ok ? 'pass' : 'fail');
    row.textContent = (ok ? '✓ ' : '✗ ') + name + (ok || !detail ? '' : ' — ' + detail);
    results.appendChild(row);
    if (ok) passed++; else failed++;
  }

  function runScenario(index) {
    if (index >= scenarios.length) return finish();
    var frame = document.createElement('iframe');
    activeScenario = scenarios[index];
    activeFrame = frame;
    nextScenario = index + 1;
    var wideScenario=activeScenario === 'widest' || activeScenario === 'fresh-wide' ||
      activeScenario === 'mission-active-wide' || activeScenario === 'comb-awakened-wide';
    var smallScenario=activeScenario === 'comb-awakened-small';
    frame.style.width = wideScenario?'1600px':(smallScenario?'320px':'390px');
    frame.style.height = wideScenario?'900px':(smallScenario?'568px':'844px');
    frame.src = 'app-main-harness.html?scenario=' + activeScenario + '&run=' + Date.now();
    frame.title = 'controlled ' + activeScenario + ' scenario';
    document.body.appendChild(frame);
    scenarioTimer = window.setTimeout(function () {
      completeScenario({
        scenario: activeScenario,
        errors: ['Scenario timed out before returning a valid result'],
        cellCount: 0,
        stateCount: 0
      });
    }, 3000);
  }

  function completeScenario(report) {
    window.clearTimeout(scenarioTimer);
    scenarioTimer = 0;
    reports[activeScenario] = report;
    if (activeFrame && activeFrame.parentNode) activeFrame.parentNode.removeChild(activeFrame);
    activeFrame = null;
    activeScenario = '';
    runScenario(nextScenario);
  }

  window.addEventListener('message', function (event) {
    if (event.origin !== location.origin || !event.data || event.data.type !== 'bhive-app-main-result') return;
    var report = event.data.result;
    if (!activeFrame || !report || report.scenario !== activeScenario || !Array.isArray(report.errors)) return;
    completeScenario(report);
  });

  function finish() {
    var fresh = reports.fresh, freshWide = reports['fresh-wide'],
      healthSelect = reports['health-select'], peopleSelect = reports['people-select'],
      resumeSelected = reports['resume-selected'], progress = reports.progress,
      missionReady = reports['mission-ready'], missionActive = reports['mission-active'],
      missionActiveWide = reports['mission-active-wide'],
      acceptSaveFailure = reports['accept-save-failure'], saveFailure = reports['save-failure'],
      answerSaveFailure = reports['answer-save-failure'],
      genuineCompletion = reports['genuine-completion'],
      completionReload = reports['completion-reload'],
      completionSaveFailure = reports['completion-save-failure'],
      completionNoReveal = reports['completion-no-reveal'],
      completionStale = reports['completion-stale'],
      completionMalformed = reports['completion-malformed'],
      completionDomainFailure = reports['completion-domain-failure'],
      completionThrow = reports['completion-throw'],
      completionRerender = reports['completion-rerender'],
      completionInvalidWorker = reports['completion-invalid-worker'],
      completionInvalidLearning = reports['completion-invalid-learning'],
      completionInvalidCompletion = reports['completion-invalid-completion'],
      completionAlreadyResult = reports['completion-already-result'],
      completionPresentationThrow = reports['completion-presentation-throw'],
      completionPresentationDispose = reports['completion-presentation-dispose'],
      combAwakened = reports['comb-awakened'],
      combAwakenedSmall = reports['comb-awakened-small'],
      combAwakenedWide = reports['comb-awakened-wide'],
      combNoUnlock = reports['comb-no-unlock'],
      combSkip = reports['comb-skip'], combSkipImpact = reports['comb-skip-impact'],
      combSkipBuild = reports['comb-skip-build'], combBackground = reports['comb-background'],
      combWatchdog = reports['comb-watchdog'],
      combAnimationCancel = reports['comb-animationcancel'],
      combPagehide = reports['comb-pagehide'],
      combRenderFailure = reports['comb-render-failure'], combReduced = reports['comb-reduced'],
      combEnter = reports['comb-enter'],
      completionPrivateCopy = reports['completion-private-copy'],
      normalExperiment = reports['normal-experiment'],
      completed = reports.completed, completedElder = reports['completed-elder'],
      completedZero = reports['completed-zero'],
      legacyAuto = reports['legacy-auto'],
      evolve = reports.evolve, widest = reports.widest, locked = reports.locked,
      migration = reports.migration;
    var allReports=scenarios.map(function(scenario){return reports[scenario];});
    var ca=combAwakened.firstFlightComb,cas=combAwakenedSmall.firstFlightComb;
    var caw=combAwakenedWide.firstFlightComb;
    var cn=combNoUnlock.firstFlightComb,cs=combSkip.firstFlightComb;
    var csi=combSkipImpact.firstFlightComb,csb=combSkipBuild.firstFlightComb;
    var cb=combBackground.firstFlightComb,cw=combWatchdog.firstFlightComb;
    var cac=combAnimationCancel.firstFlightComb,crf=combRenderFailure.firstFlightComb;
    var cph=combPagehide.firstFlightComb;
    var crm=combReduced.firstFlightComb,ce=combEnter.firstFlightComb;
    test('app-main loads without an uncaught JavaScript error',
      uncaught.length === 0 && allReports.every(function(report){return report.errors.length===0;}),
      uncaught.concat.apply(uncaught,allReports.map(function(report){return report.errors;})).join('; '));
    test('deterministic state contains all 14 cells',
      allReports.every(function(report){return report.stateCount===14;}));
    test('a genuinely fresh load becomes First Flight eligible in memory',
      fresh.firstFlightStartup && fresh.firstFlightStartup.status === 'available' &&
        freshWide.firstFlightStartup && freshWide.firstFlightStartup.status === 'available');
    test('fresh startup records exactly one canonical availability event',
      fresh.firstFlightStartup.canonicalAvailability &&
        fresh.firstFlightStartup.availabilityCount === 1 &&
        freshWide.firstFlightStartup.canonicalAvailability &&
        freshWide.firstFlightStartup.availabilityCount === 1);
    test('availability alone does not persist a new blank Hive',
      fresh.firstFlightStartup.noStartupSave && freshWide.firstFlightStartup.noStartupSave);
    test('fresh startup provisions exactly the canonical six questions without saving',
      [fresh,freshWide,genuineCompletion].every(function(report){
        return report.firstFlightStartup.canonicalFoundationQuestions&&
          report.firstFlightStartup.noFoundationSeedQuestions&&
          report.firstFlightStartup.startupSaveCalls===0&&
          report.firstFlightStartup.noStartupSave;
      }));
    test('fresh foundation cells start with empty swarms and no rendered cell workers',
      fresh.firstFlightStartup.foundationSwarmsEmpty &&
        fresh.firstFlightStartup.cellWorkerCount === 0 &&
        freshWide.firstFlightStartup.foundationSwarmsEmpty &&
        freshWide.firstFlightStartup.cellWorkerCount === 0);
    test('fresh startup leaves the five-bee Queen retinue unchanged',
      fresh.firstFlightStartup.queenRetinueCount === 5 &&
        freshWide.firstFlightStartup.queenRetinueCount === 5);
    test('stored legacy users remain exempt from First Flight availability',
      [evolve,widest,locked,migration].every(function(report){
        return report.firstFlightStartup && report.firstFlightStartup.status === null &&
          report.firstFlightStartup.availabilityCount === 0;
      }));
    test('stored First Flight and legacy swarms are preserved rather than cleared or reseeded',
      progress.firstFlightStartup.foundationSwarmsPreserved &&
        completed.firstFlightStartup.foundationSwarmsPreserved &&
        widest.firstFlightStartup.foundationSwarmsPreserved && widest.legacyLoaded &&
        migration.migrationVisibility && migration.migrationVisibility.dataPreserved);
    test('an incomplete First Flight resumes with its exact events and derived state',
      progress.firstFlightStartup.status === 'first_answer_recorded' &&
        progress.firstFlightStartup.cellKey === 'lw' &&
        progress.firstFlightStartup.answers.join('|') === 'Finishing the beta matters most' &&
        progress.firstFlightStartup.availabilityCount === 1 &&
        progress.firstFlightStartup.storedEventsPreserved);
    test('resumable incomplete states reconcile canonical questions in memory without data loss or save',
      [resumeSelected,progress,missionReady,missionActive,missionActiveWide,
        acceptSaveFailure,completionSaveFailure,completionNoReveal,completionStale,
        completionMalformed,completionDomainFailure,completionThrow,completionRerender,
        completionInvalidWorker,completionInvalidLearning,completionInvalidCompletion,
        completionAlreadyResult,completionPresentationThrow,completionPresentationDispose,
        completionPrivateCopy]
        .every(function(report){
        return report.firstFlightStartup.canonicalFoundationQuestions&&
          report.firstFlightStartup.noFoundationSeedQuestions&&
          report.firstFlightStartup.resumableQuestionPreserved&&
          report.firstFlightStartup.storedHiveUnchanged&&
          report.firstFlightStartup.startupSaveCalls===0;
      }));
    test('a completed First Flight remains completed and receives no duplicate availability',
      completed.firstFlightStartup.status === 'mission_completed' &&
        completed.firstFlightStartup.completedEventId === 'evt_first_flight_v1_completed_lw' &&
        completed.firstFlightStartup.availabilityCount === 1 &&
        completed.firstFlightStartup.storedEventsPreserved);
    test('legacy and completed startup snapshots remain byte-for-byte unchanged',
      completed.firstFlightStartup.storedHiveUnchanged&&
        legacyAuto.firstFlightStartup.storedHiveUnchanged&&
        widest.firstFlightStartup.storedHiveUnchanged);
    test('fresh availability is idempotent under a repeated startup event attempt',
      fresh.firstFlightStartup.duplicateRejected &&
        fresh.firstFlightStartup.availabilityCount === 1 &&
        freshWide.firstFlightStartup.duplicateRejected &&
        freshWide.firstFlightStartup.availabilityCount === 1);
    test('fresh startup keeps only the foundation reveal trail with Core and all foundations visible',
      fresh.cellCount === 3 && fresh.firstFlightStartup.exactFoundationUnlocks &&
        fresh.firstFlightStartup.foundationVisible && fresh.firstFlightStartup.coreVisible &&
        freshWide.cellCount === 3 && freshWide.firstFlightStartup.exactFoundationUnlocks &&
        freshWide.firstFlightStartup.foundationVisible && freshWide.firstFlightStartup.coreVisible);
    test('eligible fresh users see the exact Queen opening and exactly three foundation choices',
      fresh.firstFlightStartup.interfacePresent && fresh.firstFlightFlow &&
        fresh.firstFlightFlow.opening === 'What needs your attention most right now?' &&
        fresh.firstFlightFlow.choices.join('|') === 'Life & Work|Health|People' &&
        freshWide.firstFlightStartup.interfacePresent);
    test('legacy and completed users do not see First Flight questions',
      completed.firstFlightStartup.interfaceInactive &&
        legacyAuto.firstFlightStartup.interfaceInactive &&
        [evolve,widest,locked,migration].every(function(report){
          return report.firstFlightStartup.interfaceInactive;
        }));
    test('Complete First Mission exists only for authoritative mission_active states',
      [fresh,resumeSelected,progress,missionReady,genuineCompletion,normalExperiment,
        completed,legacyAuto,evolve,widest,locked,migration]
        .every(function(report){
          return report.firstFlightStartup.completionControlCount===0;
        })&&
        [missionActive,missionActiveWide,completionSaveFailure,completionNoReveal,
          completionStale,completionMalformed,completionDomainFailure,completionThrow,
          completionRerender]
          .every(function(report){
            return report.firstFlightStartup.completionControlCount===1;
          }));
    test('cell selection creates one canonical event, saves once and focuses question one',
      fresh.firstFlightFlow.selectionState === 'cell_selected' &&
        fresh.firstFlightFlow.selectionEventCount === 1 &&
        fresh.firstFlightFlow.selectionEventCanonical &&
        fresh.firstFlightFlow.selectionSaved &&
        fresh.firstFlightFlow.questionOneFocused);
    test('every foundation choice renders its exact approved first question',
      fresh.firstFlightFlow.questionOne ===
        'What feels most important in your work or direction right now?' &&
        healthSelect.firstFlightFlow.cellKey === 'health' &&
        healthSelect.firstFlightFlow.questionOne ===
          'How are your body and energy feeling right now?' &&
        healthSelect.firstFlightFlow.selectionEventCount === 1 &&
        healthSelect.firstFlightFlow.saveCalls === 1 &&
        peopleSelect.firstFlightFlow.cellKey === 'people' &&
        peopleSelect.firstFlightFlow.questionOne ===
          'Which relationship or connection needs your attention most right now?' &&
        peopleSelect.firstFlightFlow.selectionEventCount === 1);
    test('question two appears only after answer one and uses the approved cell copy',
      fresh.firstFlightFlow.questionTwo ===
        'What is one small step you can take toward it today?' &&
        fresh.firstFlightFlow.questionTwoFocused &&
        peopleSelect.firstFlightFlow.questionTwo ===
          'What is one small, respectful step you can take today?' &&
        peopleSelect.firstFlightFlow.answerEventCount === 1 &&
        peopleSelect.firstFlightFlow.saveCalls === 2);
    test('answers are normalized, persisted once each and rapid repeat submissions stay idempotent',
      fresh.firstFlightFlow.firstAnswer === 'Finish the first flight interface' &&
        fresh.firstFlightFlow.firstAnswerSaved &&
        fresh.firstFlightFlow.answerEventCount === 2 &&
        fresh.firstFlightFlow.saveCalls === 3);
    test('blank and over-280-character answers are rejected without saving or advancing',
      fresh.firstFlightFlow.blankRejected && fresh.firstFlightFlow.longRejected);
    test('mission_ready shows the deterministic mission with exactly one Begin action',
      fresh.firstFlightFlow.readyState === 'mission_ready' &&
        fresh.firstFlightFlow.readySaved &&
        fresh.firstFlightFlow.missionTitle === 'Make the first move' &&
        fresh.firstFlightFlow.missionAction === 'Write one focused test' &&
        fresh.firstFlightFlow.readyBeginOnly &&
        fresh.firstFlightFlow.readyFocused);
    test('staged answers create no learning, experiment, strategy or completion effects',
      fresh.firstFlightFlow.protectedStateUnchanged &&
        fresh.firstFlightFlow.noLearningEvents &&
        fresh.firstFlightFlow.noAcceptedEvents &&
        fresh.firstFlightFlow.noCompletedEvents &&
        fresh.firstFlightFlow.zeroStrategyEvidence &&
        fresh.firstFlightFlow.completionOperationCalls === 0);
    test('save failure rolls back live state, stays recoverable and creates no snapshot',
      saveFailure.firstFlightFlow.status === 'available' &&
        saveFailure.firstFlightFlow.selectionEventCount === 0 &&
        saveFailure.firstFlightFlow.saveCalls === 1 &&
        saveFailure.firstFlightFlow.storageAbsent &&
        saveFailure.firstFlightFlow.protectedStateUnchanged &&
        saveFailure.firstFlightFlow.openingStillVisible &&
        saveFailure.firstFlightFlow.recoverableError &&
        saveFailure.firstFlightFlow.focusReturned);
    test('answer save failure restores question one, its text and the last persisted selection',
      answerSaveFailure.firstFlightFlow.status === 'cell_selected' &&
        answerSaveFailure.firstFlightFlow.selectionEventCount === 1 &&
        answerSaveFailure.firstFlightFlow.answerEventCount === 0 &&
        answerSaveFailure.firstFlightFlow.saveCalls === 2 &&
        answerSaveFailure.firstFlightFlow.savedStatus === 'cell_selected' &&
        answerSaveFailure.firstFlightFlow.protectedStateUnchanged &&
        answerSaveFailure.firstFlightFlow.answerRestored &&
        answerSaveFailure.firstFlightFlow.recoverableError &&
        answerSaveFailure.firstFlightFlow.focusReturned);
    test('reload after selection resumes at question one without a startup save',
      resumeSelected.firstFlightFlow.status === 'cell_selected' &&
        resumeSelected.firstFlightFlow.question ===
          'What feels most important in your work or direction right now?' &&
        resumeSelected.firstFlightFlow.eventsPreserved &&
        resumeSelected.firstFlightFlow.startupSaveCalls === 0);
    test('reload after answer one resumes at question two without a startup save',
      progress.firstFlightFlow.status === 'first_answer_recorded' &&
        progress.firstFlightFlow.question ===
          'What is one small step you can take toward it today?' &&
        progress.firstFlightFlow.eventsPreserved &&
        progress.firstFlightFlow.startupSaveCalls === 0);
    test('reload after answer two exposes only the matching deterministic Begin action',
      missionReady.firstFlightFlow.initialStatus === 'mission_ready' &&
        missionReady.firstFlightFlow.readyTitle === 'Make the first move' &&
        missionReady.firstFlightFlow.readyAction === 'Complete one focused beta task' &&
        missionReady.firstFlightFlow.beginCount === 1 &&
        missionReady.firstFlightFlow.beginText === 'Begin First Mission' &&
        missionReady.firstFlightFlow.readyControlCount === 1);
    test('beginning the mission records one canonical acceptance, saves once and is idempotent',
      missionReady.firstFlightFlow.activeStatus === 'mission_active' &&
        missionReady.firstFlightFlow.activeSaved &&
        missionReady.firstFlightFlow.acceptedEventCount === 1 &&
        missionReady.firstFlightFlow.canonicalAcceptance &&
        missionReady.firstFlightFlow.saveCalls === 1);
    test('mission_active presents the exact mission with only Complete First Mission',
      missionReady.firstFlightFlow.activeHeading === 'Your First Mission is active.' &&
        missionReady.firstFlightFlow.activeTitle === 'Make the first move' &&
        missionReady.firstFlightFlow.activeAction === 'Complete one focused beta task' &&
        missionReady.firstFlightFlow.activeInProgress === 'In progress' &&
        missionReady.firstFlightFlow.activeCompletionOnly &&
        missionReady.firstFlightFlow.activeFocused &&
        missionReady.firstFlightFlow.interfaceCount === 1);
    test('mission acceptance has no learning, completion, evidence, bee, unlock or reward effects',
      missionReady.firstFlightFlow.protectedStateUnchanged &&
        missionReady.firstFlightFlow.answerEventsUnchanged &&
        missionReady.firstFlightFlow.noLearningEvents &&
        missionReady.firstFlightFlow.addLearningCalls === 0 &&
        missionReady.firstFlightFlow.unlockCalls === 0 &&
        missionReady.firstFlightFlow.noCompletedEvents &&
        missionReady.firstFlightFlow.zeroStrategyEvidence &&
        missionReady.firstFlightFlow.completionOperationCalls === 0);
    test('acceptance save failure restores live and persisted mission_ready state for a safe retry',
      acceptSaveFailure.firstFlightFlow.failedStatus === 'mission_ready' &&
        acceptSaveFailure.firstFlightFlow.failedSavedStatus === 'mission_ready' &&
        acceptSaveFailure.firstFlightFlow.failedAcceptedEventCount === 0 &&
        acceptSaveFailure.firstFlightFlow.failureEventsRestored &&
        acceptSaveFailure.firstFlightFlow.failureStoredRestored &&
        acceptSaveFailure.firstFlightFlow.failureError &&
        acceptSaveFailure.firstFlightFlow.failureLiveRegion &&
        acceptSaveFailure.firstFlightFlow.failureFocus);
    test('retry after acceptance save failure creates one canonical active mission and no side effects',
      acceptSaveFailure.firstFlightFlow.retryStatus === 'mission_active' &&
        acceptSaveFailure.firstFlightFlow.retrySaved &&
        acceptSaveFailure.firstFlightFlow.retryAcceptedEventCount === 1 &&
        acceptSaveFailure.firstFlightFlow.retryCanonical &&
        acceptSaveFailure.firstFlightFlow.saveCalls === 2 &&
        acceptSaveFailure.firstFlightFlow.protectedStateUnchanged &&
        acceptSaveFailure.firstFlightFlow.answerEventsUnchanged &&
        acceptSaveFailure.firstFlightFlow.noLearningEvents &&
        acceptSaveFailure.firstFlightFlow.addLearningCalls === 0 &&
        acceptSaveFailure.firstFlightFlow.unlockCalls === 0 &&
        acceptSaveFailure.firstFlightFlow.noCompletedEvents &&
        acceptSaveFailure.firstFlightFlow.completionOperationCalls === 0 &&
        acceptSaveFailure.firstFlightFlow.retryFocused);
    test('reload resumes the accepted mission without duplication or startup persistence',
      [missionActive,missionActiveWide].every(function(report){
        return report.firstFlightFlow.status === 'mission_active' &&
          report.firstFlightFlow.acceptedEventId === 'evt_harness_first_flight_accepted' &&
          report.firstFlightFlow.acceptedEventCount === 1 &&
          report.firstFlightFlow.heading === 'Your First Mission is active.' &&
          report.firstFlightFlow.title === 'Make the first move' &&
          report.firstFlightFlow.action === 'Complete one focused beta task' &&
          report.firstFlightFlow.inProgress === 'In progress' &&
          report.firstFlightFlow.completionOnly && report.firstFlightFlow.completionFocusable &&
          report.firstFlightFlow.interfaceCount === 1 &&
          report.firstFlightFlow.eventsPreserved && report.firstFlightFlow.startupSaveCalls === 0 &&
          report.firstFlightFlow.completionOperationCalls === 0 &&
          report.firstFlightFlow.addLearningCalls === 0 &&
          report.firstFlightFlow.unlockCalls === 0;
      }));
    test('the genuine production UI reaches mission_active and invokes the domain operation once',
      genuineCompletion.firstFlightFlow.startupAvailable&&
        genuineCompletion.firstFlightFlow.selectionSavedCanonical&&
        genuineCompletion.firstFlightFlow.readyStatus==='mission_ready'&&
        genuineCompletion.firstFlightFlow.activeStatus==='mission_active'&&
        genuineCompletion.firstFlightFlow.completionButtonCount===1&&
        genuineCompletion.firstFlightFlow.completionButtonText==='Complete First Mission'&&
        genuineCompletion.firstFlightFlow.completionButtonType==='button'&&
        genuineCompletion.firstFlightFlow.completionButtonFocused&&
        genuineCompletion.firstFlightFlow.completionOk&&
        genuineCompletion.firstFlightFlow.completionCalls===1&&
        genuineCompletion.firstFlightFlow.requestCanonical&&
        genuineCompletion.firstFlightFlow.reentrantActivationBlocked&&
        genuineCompletion.firstFlightFlow.completedStatus==='mission_completed'&&
        genuineCompletion.firstFlightFlow.persistedCompleted);
    test('genuine completion promotes exactly two answers and consumes only the selected canonical pair',
      genuineCompletion.firstFlightFlow.exactLearnings&&
        genuineCompletion.firstFlightFlow.selectedQuestionsConsumed&&
        genuineCompletion.firstFlightFlow.otherQuestionsUnchanged);
    test('genuine completion adds only the selected age-3 worker and keeps quiet swarms empty',
      genuineCompletion.firstFlightFlow.selectedWorkerOnly&&
        genuineCompletion.firstFlightFlow.unselectedFoundationsEmpty&&
        genuineCompletion.firstFlightFlow.revealedSeedWasAppOwned&&
        genuineCompletion.firstFlightFlow.revealedEmpty&&
        genuineCompletion.firstFlightFlow.otherSwarmsUnchanged&&
        genuineCompletion.firstFlightFlow.queenRetinueUnchanged&&
        genuineCompletion.firstFlightFlow.globalSeedCalls===0);
    test('genuine completion makes one quiet unlock attempt and at most one approved reveal',
      genuineCompletion.firstFlightFlow.unlockCalls===1&&
        genuineCompletion.firstFlightFlow.quietUnlockRequest&&
        genuineCompletion.firstFlightFlow.singleReveal);
    test('genuine completion persists once with neutral outcome and no evidence or reward',
      genuineCompletion.firstFlightFlow.deliberateSaveCallsBeforeCompletion===4&&
        genuineCompletion.firstFlightFlow.completionSaveCalls===1&&
        genuineCompletion.firstFlightFlow.domainOwnedSaveCalls===1&&
        genuineCompletion.firstFlightFlow.uiSaveCalls===0&&
        genuineCompletion.firstFlightFlow.neutralCompletion&&
        genuineCompletion.firstFlightFlow.zeroStrategyEvidence&&
        genuineCompletion.firstFlightFlow.noNormalLearningCalls&&
        genuineCompletion.firstFlightFlow.noAdditionalReward&&
        genuineCompletion.firstFlightFlow.savedMatchesLive);
    test('successful completion removes First Flight and announces the normal Hive return',
      genuineCompletion.firstFlightFlow.interfaceRemoved&&
        genuineCompletion.firstFlightFlow.normalPresentation&&
        genuineCompletion.firstFlightFlow.successAnnouncement&&
        genuineCompletion.firstFlightFlow.onboardingUnchanged);
    test('fresh completion mounts exactly one truthful player-controlled reward summary under reentry',
      genuineCompletion.firstFlightFlow.rewardSummaryOnce&&
        genuineCompletion.firstFlightFlow.rewardSemantics&&
        genuineCompletion.firstFlightFlow.truthfulRewardCards&&
        genuineCompletion.firstFlightFlow.completionCalls===1);
    test('the reward summary names the genuine unlock and the Hive keeps one authoritative Worker marker',
      genuineCompletion.firstFlightFlow.realUnlockCard&&
        genuineCompletion.firstFlightFlow.selectedMarker);
    test('ENTER THE HIVE dismisses from keyboard focus without another completion, save or mutation',
      genuineCompletion.firstFlightFlow.enterDismissed);
    test('a stale rendered mission is blocked, rerendered from authority and safely retried',
      completionStale.firstFlightFlow.initialStatus==='mission_active'&&
        completionStale.firstFlightFlow.authoritativeStatus==='mission_active'&&
        completionStale.firstFlightFlow.displayedActionChanged&&
        completionStale.firstFlightFlow.staleActivationBlocked&&
        completionStale.firstFlightFlow.zeroCallsBeforeRetry&&
        completionStale.firstFlightFlow.freshButton&&
        completionStale.firstFlightFlow.freshFocus&&
        completionStale.firstFlightFlow.changedAnnouncement&&
        completionStale.firstFlightFlow.staleRewardDisposed&&
        completionStale.firstFlightFlow.freshRewardAfterRetry&&
        completionStale.firstFlightFlow.retryCompleted&&

    test('legacy-compatible state can save again with all four fields', widest.savedAgain);
    test('legitimate non-Agent priority path remains visible and targetable',
      widest.nextButtonPresent && widest.priorityClass);
    test('legacy cellLevel and Agent visual growth classes remain observable',
      widest.growthClass && widest.apexClass);

    var mobile = evolve.navigation && evolve.navigation.mobile;
    var desktop = widest.navigation && widest.navigation.desktop;
    var production = evolve.navigation && evolve.navigation.production;
    test('mobile bottom navbar is visible with exactly Hive, Today, Check In and More',
      mobile && mobile.navbarVisible && mobile.desktopNavHidden && mobile.navbarButtonsVisible &&
        mobile.labels.join('|') === 'Hive|Today|Check In|More' && production &&
        production.navbarCount === 1 &&
        production.navbarIds.join('|') === 'mobile-nav-hive|mobile-nav-today|cmd-checkin|cmd-more' &&
        production.navbarLabels.join('|') === 'Hive|Today|Check In|More');
    test('mobile command bar is removed from the visible interface',
      mobile && mobile.commandBarCount === 0 && production &&
        production.commandBarCount === 0);
    test('legacy navigation markup (#navmenu / #navmenu-btn) cannot silently return',
      production && production.legacyNavCount === 0);
    test('one canonical More menu opens without rerouting from another screen',
      mobile && mobile.menuCount === 1 && mobile.visibleMenus === 1 && mobile.menuFromOtherScreen &&
        production && production.menuCount === 1 && production.menuTopLevel);
    test('More contains only live grouped actions with Reset separated and placeholders absent',
      mobile && mobile.menuLabels.join('|') ===
        'Report|History|Bestiary|Field Manual|Help / Restart Tour|Finish Beta & Send Feedback|Reset Hive' &&
        mobile.menuTilesVisible && mobile.mainCommands.join('|') === 'report|history|bestiary|manual' &&
        mobile.supportCommands.join('|') === 'help|finish' && mobile.dangerCommands.join('|') === 'reset' &&
        mobile.resetSeparated && mobile.placeholdersAbsent && production &&
        production.mainCommands.join('|') === 'report|history|bestiary|manual' &&
        production.supportCommands.join('|') === 'help|finish' &&
        production.dangerCommands.join('|') === 'reset' &&
        production.menuLabels.join('|') ===
          'Report|History|Bestiary|Field Manual|Help / Restart Tour|Finish Beta & Send Feedback|Reset Hive' &&
        production.placeholderCount === 0);
    test('mobile Hive, Today, Check In and main More destinations reuse live routes',
      mobile && mobile.primaryRoutes && mobile.mainRoutes && production &&
        production.proxyTargetsPresent && production.routeTargetsPresent);
    test('mobile Help, Finish Beta and confirmation-gated Reset reuse existing flows while floats stay hidden',
      mobile && mobile.supportRoutes && mobile.resetRoute && mobile.helpHidden && mobile.finishHidden);
    test('desktop left rail remains the functional column navigation and mobile controls stay hidden',
      desktop && desktop.railVisible && desktop.navVisible && desktop.linksVisible && desktop.navIsColumn &&
        desktop.liveRoutes && desktop.bottomHidden && desktop.commandBarCount === 0 && desktop.moreHidden &&
        production && production.routeTargetsPresent && production.railRoutes.join('|') ===
          '#home|#energy|#system|#brainmap|#bestiary|#manual|#blueprints');
    test('desktop retains one visible Help control while floating Finish Beta stays hidden',
      desktop && desktop.helpVisible && desktop.finishHidden && desktop.manualProxyHidden &&
        production && production.manualProxyCount === 1);

    document.documentElement.dataset.testReport = JSON.stringify(reports);
    window.__BHIVE_TEST_RESULTS = {passed:passed,failed:failed,reports:reports,uncaught:uncaught};
    document.documentElement.dataset.testStatus = failed ? 'failed' : 'passed';
    summary.innerHTML = '<b>' + passed + '/' + (passed + failed) + ' passed</b>' +
      (failed ? ' — integration scaffold failed' : ' — app-main integration scaffold passed');
    try {
      localStorage.removeItem('lw-brainmap-hive-v1');
      localStorage.removeItem('lw-brainmap-queen-v1');
      localStorage.removeItem('lw-brainmap-tour-v2');
    } catch (_) {}
  }

  runScenario(0);
})();
